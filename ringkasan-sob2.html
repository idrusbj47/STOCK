<style>
#results-section{min-width:0}
#results-section .section-title{margin-bottom:7px}
#results.results{display:block;overflow:auto;gap:0;padding:0;scrollbar-gutter:stable}
#results .sob-sheet{border-collapse:separate;border-spacing:0;width:100%;min-width:570px;table-layout:fixed;font:10.5px/1.26 var(--font-body,'Inter',sans-serif);color:var(--text)}
#results .sob-sheet th{position:sticky;top:0;z-index:5;background:var(--surface-2);color:var(--muted);font-size:9.5px;font-weight:700;text-align:left;text-transform:uppercase;letter-spacing:.01em;padding:7px 6px;border-bottom:1px solid var(--border)}
#results .sob-sheet td{padding:6px;border-bottom:1px solid var(--grid);vertical-align:top;overflow-wrap:anywhere;word-break:normal}
#results .sob-sheet tbody tr:nth-child(even) td{background:color-mix(in srgb,var(--surface) 92%,var(--primary) 8%)}
#results .sob-sheet tbody tr:hover td{background:var(--navy-s)}
#results .sob-sheet .sob-ref{font:10px/1.3 var(--font-mono,monospace);color:var(--muted);margin-bottom:3px;overflow-wrap:anywhere}
#results .sob-sheet .sob-model{font-size:11px;font-weight:700;color:var(--text)}
#results .sob-sheet .sob-strong{font-weight:700;color:var(--text)}
#results .sob-sheet .sob-line{display:block;margin-top:2px}
#results .sob-sheet .sob-muted{color:var(--muted)}
#results .sob-sheet .sob-age{display:inline-block;padding:2px 5px;border-radius:5px;font:700 9.5px var(--font-mono,monospace)}
#results .sob-sheet .sob-num{font-variant-numeric:tabular-nums;white-space:nowrap}
#results .sob-sheet .sob-empty{text-align:center;padding:24px;color:var(--muted)}
@media(max-width:700px){#results .sob-sheet{min-width:570px;font-size:10px}#results .sob-sheet td{padding:5px 4px}}
</style>
<script>
window.renderItems=function(scope){
  let list=state.selected?scope.filter(r=>nrm(r[state.selected.dim])===state.selected.key):scope;
  list=list.slice().sort((a,b)=>b.kg-a.kg);
  const wrap=$('results'),total=list.reduce((a,r)=>a+r.kg,0),e=v=>escapeHtml(v==null?'':v);
  $('results-count').textContent=fmtInt(list.length)+' mc · '+fmtTon(total)+' kg · semua item';
  const body=list.map(r=>`<tr>
    <td><div class="sob-ref">${e(r.so)} · MCS ${e(r.mcs||'-')}</div><div class="sob-model">${e(r.model)}</div></td>
    <td>${e(r.customer)}</td>
    <td><span class="sob-strong">${e(r.internal)}</span><span class="sob-line sob-muted">${e(r.sales)}</span></td>
    <td class="sob-num"><span class="sob-strong">${fmtInt(r.qty)}</span> pcs<span class="sob-line"><span class="sob-strong">${fmtNum(r.kg,0)}</span> kg</span></td>
    <td><span class="sob-age sb-${AG[r.ag].k}">${r.um} BLN</span><span class="sob-line sob-muted">Fit ${e(r.fit||'-')}</span></td>
    <td>${e(r.tgl||'-')}<span class="sob-line sob-muted">Berat ${fmtNum(r.berat,2)} kg</span></td>
  </tr>`).join('');
  wrap.innerHTML=`<table class="sob-sheet" aria-label="Detail stok per item">
  <colgroup><col style="width:30%"><col style="width:18%"><col style="width:16%"><col style="width:14%"><col style="width:9%"><col style="width:13%"></colgroup>
  <thead><tr><th>SO · MCS · Barang</th><th>Customer</th><th>Internal / Sales</th><th>Qty / Tonase</th><th>Umur / Fit</th><th>Masuk / Berat</th></tr></thead>
  <tbody>${body||'<tr><td class="sob-empty" colspan="6">Tidak ada item.</td></tr>'}</tbody></table>`;
  const key=[state.pi,state.ag,state.search,state.selected?.dim,state.selected?.key].join('|');
  if(wrap.dataset.scope!==key){wrap.scrollTop=0;wrap.scrollLeft=0;wrap.dataset.scope=key;}
};
</script>
