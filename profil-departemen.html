<!DOCTYPE html>
<html lang="id" data-theme="light">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
<title>Profil Departemen — SBJ Apps</title>
<meta name="description" content="Profil Departemen Gudang Barang Jadi: dokumen struktur organisasi, operator forklift, PIC zona rak" />
<meta name="theme-color" content="#0b1a30" />
<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
<script>try{var t=localStorage.getItem('stockopname.theme');if(t)document.documentElement.dataset.theme=t;}catch(e){}</script>
<link rel="manifest" href="manifest.json" />
<link rel="icon" href="icons/icon.png" />
<link rel="apple-touch-icon" href="icons/icon.png" />
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Barlow+Condensed:wght@500;600;700;800&family=Inter:wght@400;500;600;700&family=JetBrains+Mono:wght@400;500;600&display=swap" rel="stylesheet">
<style>
:root{
  --navy:#0b1a30; --teal:#14a9a4; --teal2:#0d8f8b; --ind:var(--teal);
  --bg:#eef3f9; --surface:#fff; --s2:#f4f7fb; --border:#e1e9f2; --text:#0e1b33; --muted:#5b6b82;
  --red:#dc2626; --green:#15803d; --gbg:rgba(22,163,74,.14);
  --shadow:0 14px 40px rgba(15,35,70,.08),0 2px 8px rgba(15,35,70,.04);
  --fd:'Barlow Condensed',sans-serif; --fb:'Inter',sans-serif; --fm:'JetBrains Mono',monospace;
  --ease:cubic-bezier(.22,.8,.24,1); color-scheme:light;
}
html[data-theme="dark"]{
  --navy:#070f1d; --teal:#2cc7c0; --teal2:#1fa8a2;
  --bg:#0a111f; --surface:#111b2e; --s2:#16233a; --border:#22314a; --text:#eef3fb; --muted:#93a3bb;
  --red:#f87171; --green:#34d399; --gbg:rgba(52,211,153,.14);
  --shadow:0 18px 50px rgba(0,0,0,.35),0 2px 8px rgba(0,0,0,.2); color-scheme:dark;
}
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
html{min-height:100%}
body{margin:0;font-family:var(--fb);color:var(--text);background:var(--bg);-webkit-font-smoothing:antialiased;min-height:100dvh;display:flex;flex-direction:column}
button,input,select,textarea{font:inherit;color:inherit}
.wrap{max-width:2200px;margin:0 auto;padding:0 clamp(16px,2.6vw,56px);width:100%}
.adm{display:none!important}body.is-admin .adm{display:inline-flex!important}
svg.i{width:19px;height:19px;fill:none;stroke:currentColor;stroke-width:2;stroke-linecap:round;stroke-linejoin:round;flex:none}
.eyebrow{font:600 11px var(--fm);letter-spacing:.16em;text-transform:uppercase;color:var(--muted)}

/* ===== Top bar ===== */
.top{position:sticky;top:0;z-index:70;background:var(--navy);color:#fff;padding-top:env(safe-area-inset-top)}
.top .wrap{display:flex;align-items:center;gap:16px;height:68px}
.logo{display:flex;align-items:center;gap:12px;text-decoration:none;color:#fff}
.logo b{display:inline-flex;align-items:center;justify-content:center;height:40px;padding:0 9px;border:2.5px solid #fff;border-radius:11px;font:800 22px/1 var(--fd);letter-spacing:.02em}
.logo span{font:800 22px/1 var(--fd);letter-spacing:.04em;text-transform:uppercase}
.vsep{width:1px;height:30px;background:rgba(255,255,255,.2);flex:none}
.crumb{display:flex;align-items:center;gap:10px;min-width:0;flex:1;font-size:14.5px;font-weight:500;color:rgba(255,255,255,.92);white-space:nowrap;overflow:hidden}
.crumb a{display:inline-flex;color:#fff;text-decoration:none}
.crumb em{font-style:normal;opacity:.55}
.crumb .cur{color:var(--teal);font-weight:600}
.topr{display:flex;align-items:center;gap:14px;margin-left:auto}
.chip{display:inline-flex;align-items:center;gap:8px;height:42px;padding:0 16px;border-radius:12px;border:0;background:var(--teal);color:#fff;font:700 13.5px var(--fb);letter-spacing:.04em;cursor:pointer;transition:filter .2s,transform .2s var(--ease)}
.chip:hover{filter:brightness(1.08)}.chip:active{transform:scale(.97)}
body.is-admin .chip{background:#16a34a}
.tbtn{width:42px;height:42px;border:0;background:none;color:#fff;border-radius:12px;display:inline-flex;align-items:center;justify-content:center;cursor:pointer;transition:background .2s}
.tbtn:hover{background:rgba(255,255,255,.1)}
.tbtn svg.i{width:22px;height:22px}
.tbtn.back{border:1px solid rgba(255,255,255,.25);text-decoration:none;flex:none;margin-right:-4px}
.rh>div:first-child{min-width:0;flex:1}
.rh b{display:block;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.rh .tools{flex-wrap:nowrap;flex:none}

/* ===== Hero ===== */
.hero{display:flex;justify-content:space-between;align-items:flex-end;gap:24px;flex-wrap:wrap;padding:32px 0 24px}
.hero .eyebrow{color:var(--teal);font-weight:700;letter-spacing:.12em;font-size:13px}
.hero h2{margin:6px 0 0;font:800 56px/1 var(--fd);text-transform:uppercase;letter-spacing:.005em}
.hero p{margin:12px 0 0;color:var(--muted);font-size:15px;line-height:1.5;max-width:560px}
.stats{display:flex;gap:14px}
.st{display:flex;align-items:center;gap:14px;background:var(--surface);border:1px solid var(--border);border-radius:16px;padding:16px 22px;box-shadow:var(--shadow);min-width:180px}
.st svg.i{width:44px;height:44px;stroke:var(--teal);stroke-width:1.7}
.st b{display:block;font:800 36px/1 var(--fd);letter-spacing:.01em}
.st small{display:block;margin-top:2px;font-size:13px;color:var(--muted)}
.st.dt b{font:700 22px/1.1 var(--fb);letter-spacing:0}
.st.dt small{margin:0 0 4px;font-size:13.5px}

/* ===== Layout ===== */
main{flex:1;padding-bottom:28px}
.layout{display:grid;grid-template-columns:clamp(280px,19vw,380px) minmax(0,1fr);gap:clamp(20px,1.6vw,32px);align-items:start}
.side{position:sticky;top:90px;background:var(--surface);border:1px solid var(--border);border-radius:20px;box-shadow:var(--shadow);overflow:hidden}
.sh{background:var(--navy);color:#fff;padding:22px 22px 20px;font:800 24px/1 var(--fd);letter-spacing:.04em;text-transform:uppercase;border-bottom:3px solid var(--teal)}
.nav{position:relative;display:flex;flex-direction:column;gap:2px;padding:8px}
#navItems{display:contents}
.ind{position:absolute;left:0;top:0;width:0;height:0;border-radius:12px;background:linear-gradient(135deg,var(--teal),var(--teal2));box-shadow:0 8px 20px color-mix(in srgb,var(--teal) 38%,transparent);transition:transform .45s var(--ease),width .45s var(--ease),height .45s var(--ease),opacity .25s;z-index:0;opacity:0;pointer-events:none}
.ind.noanim{transition:none}
.ni{position:relative;z-index:1;display:flex;align-items:center;gap:16px;height:64px;padding:0 16px;border:0;border-radius:12px;background:none;color:var(--text);cursor:pointer;text-align:left;font:500 17px var(--fb);transition:color .3s,background .2s}
.ni:not(.on):hover{background:var(--s2)}
.ni .nic{display:inline-flex;width:34px;justify-content:center;color:var(--muted);transition:color .3s}
.ni .nic svg.i{width:30px;height:30px;stroke-width:1.7}
.ni .nl{flex:1;min-width:0;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.ni .chev{display:inline-flex;color:var(--muted);transition:color .3s,transform .35s var(--ease)}
.ni.on{color:#fff;font-weight:600}
.ni.on .nic,.ni.on .chev{color:#fff}
.ni.on .chev{transform:translateX(2px)}
.ni.add{color:var(--teal);font-weight:600;border:1.5px dashed color-mix(in srgb,var(--teal) 50%,transparent);margin-top:6px;height:50px}
.ni.add .nic{color:var(--teal)}.ni.add .nic svg.i{width:20px;height:20px}
.sinfo{display:flex;gap:14px;align-items:center;margin:8px 10px 14px;padding:16px;border-radius:14px;background:color-mix(in srgb,var(--teal) 10%,var(--surface));font-size:15px;line-height:1.45}
.sinfo svg.i{width:26px;height:26px;color:var(--teal);stroke-width:2}
.sadm{padding:0 10px 14px}

.panel-wrap{min-width:0}
#panel{transition:opacity .14s ease,transform .14s ease}
#panel.out{opacity:0;transform:translate(var(--ox,0),var(--oy,-8px))}
#panel.in{animation:pin .4s var(--ease) both}
@keyframes pin{from{opacity:0;transform:translate(var(--dx,0),var(--dy,16px))}to{opacity:1;transform:none}}

.pc{background:var(--surface);border:1px solid var(--border);border-radius:20px;box-shadow:var(--shadow);overflow:hidden}
.ph{display:flex;gap:16px;align-items:center;padding:20px 24px;flex-wrap:wrap}
.pico{display:inline-flex;color:var(--teal)}
.pico svg.i{width:52px;height:52px;stroke-width:1.6}
.pt{flex:1;min-width:200px}
.pt h3{margin:0;font:800 34px/1 var(--fd);text-transform:uppercase;letter-spacing:.01em}
.meta{display:flex;flex-wrap:wrap;align-items:center;margin-top:8px;font-size:14px;color:var(--muted)}
.meta span{display:inline-flex;align-items:center;gap:7px}
.meta span+span::before{content:"";width:1px;height:16px;background:var(--border);margin:0 14px}
.meta svg.i{width:17px;height:17px}
.btn{display:inline-flex;align-items:center;gap:8px;height:42px;padding:0 16px;border-radius:12px;border:1px solid var(--border);background:var(--surface);cursor:pointer;font-weight:600;font-size:13.5px;white-space:nowrap;transition:border-color .2s,transform .2s var(--ease),filter .2s}
.btn:hover{border-color:var(--teal)}.btn:active{transform:scale(.97)}
.btn.pri{background:var(--teal);border-color:var(--teal);color:#fff}
.btn.pri:hover{filter:brightness(1.08)}
.btn.out{border:1.5px solid var(--teal);color:var(--teal);background:transparent;font-size:15px}
.btn.out:hover{background:color-mix(in srgb,var(--teal) 10%,transparent)}
.btn svg.i{width:18px;height:18px}
.btn:disabled,.ib:disabled{opacity:.4;cursor:not-allowed}
.ib{width:42px;height:42px;border-radius:12px;border:1px solid var(--border);background:var(--surface);display:inline-flex;align-items:center;justify-content:center;cursor:pointer;color:var(--text);flex:none;font-size:20px;line-height:1;transition:border-color .2s,color .2s,transform .2s var(--ease)}
.ib:hover:not(:disabled){border-color:var(--teal);color:var(--teal)}.ib:active:not(:disabled){transform:scale(.94)}
.ib.sm{width:38px;height:38px;border-radius:10px}
.ib.dng:hover{color:var(--red);border-color:var(--red)}
.tools{display:flex;gap:8px;flex-wrap:wrap;align-items:center}
.abar{gap:8px;flex-wrap:wrap;align-items:center;padding:12px 24px;border-top:1px dashed var(--border);background:var(--s2)}
.docs{display:flex;gap:8px;flex-wrap:wrap;padding:12px 24px;border-top:1px solid var(--border)}
.dchip{border:1px solid var(--border);background:var(--surface);border-radius:99px;padding:8px 14px;cursor:pointer;font-size:13px;font-weight:600;transition:all .2s}
.dchip.on{background:var(--teal);border-color:var(--teal);color:#fff}
.dket{margin:0;padding:12px 24px 0;font-size:14px;color:var(--muted);line-height:1.5}
.vwrap{padding:16px 18px 0;border-top:1px solid var(--border);margin-top:0}
.docs+.vwrap,.dket+.vwrap{border-top:0}
.frame{background:var(--s2);border-radius:14px;padding:14px}
.viewer{overflow:hidden;border-radius:10px;background:#fff;box-shadow:var(--shadow);touch-action:pan-y}
.track{display:flex;transition:transform .5s var(--ease);will-change:transform}
.slide{flex:0 0 100%;min-width:0;display:flex;align-items:center;justify-content:center;background:#fff}
.slide img{display:block;width:100%;height:auto;max-height:max(440px,calc(100dvh - 300px));object-fit:contain;opacity:0;transition:opacity .5s ease;min-height:180px}
.slide img.ld{opacity:1}
.pbar{display:flex;align-items:center;justify-content:space-between;gap:12px;padding:14px 8px 16px}
.pbar span{font-size:16px}
.pbar .tools{gap:10px}
.pbtn{width:56px;height:44px;border-radius:12px;border:1px solid var(--border);background:var(--surface);display:inline-flex;align-items:center;justify-content:center;cursor:pointer;transition:all .2s var(--ease)}
.pbtn.nx{background:var(--teal);border-color:var(--teal);color:#fff}
.pbtn:hover:not(:disabled){filter:brightness(1.06);transform:translateY(-1px)}.pbtn:active:not(:disabled){transform:scale(.95)}
.pbtn:disabled{opacity:.4;cursor:not-allowed}
.empty{text-align:center;padding:64px 20px;color:var(--muted)}
.empty svg.i{width:48px;height:48px;stroke:var(--teal);stroke-width:1.5;opacity:.8;margin-bottom:10px}
.empty p{margin:0 0 16px;font-size:14px}
.qk{gap:8px;flex-wrap:wrap;justify-content:center}
.sk{height:320px;margin:20px;border-radius:14px;background:linear-gradient(90deg,var(--s2) 25%,var(--border) 50%,var(--s2) 75%);background-size:200% 100%;animation:sh 1.3s infinite linear}
@keyframes sh{to{background-position:-200% 0}}

.foot{border-top:1px solid var(--border);background:color-mix(in srgb,var(--surface) 70%,var(--bg));padding:16px 0;font-size:14px;color:var(--muted)}
.foot .wrap{display:flex;justify-content:space-between;align-items:center;gap:12px;flex-wrap:wrap}
.foot b{color:var(--text);font-weight:600;padding-right:14px;margin-right:14px;border-right:1px solid var(--border)}
.foot .lk{display:inline-flex;align-items:center;gap:8px}
.foot svg.i{width:16px;height:16px}

/* ===== Dialog ===== */
dialog{border:0;padding:0;border-radius:20px;background:var(--surface);color:var(--text);width:min(520px,calc(100vw - 28px));box-shadow:0 30px 80px rgba(0,0,0,.35)}
dialog[open]{animation:dlg .26s var(--ease)}
@keyframes dlg{from{opacity:0;transform:translateY(14px) scale(.98)}to{opacity:1;transform:none}}
dialog::backdrop{background:rgba(8,13,25,.55);backdrop-filter:blur(3px)}
.mh{padding:20px 22px 4px}
.mh h3{margin:0;font:800 26px var(--fd);text-transform:uppercase}
.mb{padding:10px 22px;display:grid;grid-template-columns:1fr 1fr;gap:12px;max-height:62vh;overflow:auto}
.fld{display:flex;flex-direction:column;gap:6px}
.fld.w{grid-column:1/-1}
.fld label{font:600 10.5px var(--fm);letter-spacing:.08em;text-transform:uppercase;color:var(--muted)}
.fld input,.fld textarea{width:100%;min-height:42px;padding:9px 12px;border-radius:11px;border:1px solid var(--border);background:var(--s2);outline:none;font-size:16px}
.fld textarea{min-height:84px;resize:vertical}
.fld input:focus,.fld textarea:focus{border-color:var(--teal);box-shadow:0 0 0 3px color-mix(in srgb,var(--teal) 18%,transparent)}
.pw{position:relative}.pw input{padding-right:46px}
.pw button{position:absolute;right:4px;top:3px;width:36px;height:36px;border:0;background:none;color:var(--muted);cursor:pointer}
.mf{display:flex;justify-content:flex-end;gap:8px;padding:14px 22px 20px}
.icp{display:grid;grid-template-columns:repeat(auto-fill,minmax(72px,1fr));gap:8px}
.ic{cursor:pointer;display:block}
.ic input{position:absolute;opacity:0;pointer-events:none}
.ic span{display:flex;flex-direction:column;align-items:center;gap:4px;padding:10px 4px 8px;border:1px solid var(--border);border-radius:12px;background:var(--s2);color:var(--muted);transition:all .2s var(--ease)}
.ic span svg.i{width:26px;height:26px;stroke-width:1.7}
.ic small{font-size:10.5px;font-weight:600;text-align:center;line-height:1.1}
.ic:hover span{border-color:var(--teal);color:var(--text)}
.ic input:checked+span{background:var(--teal);border-color:var(--teal);color:#fff;transform:scale(1.04)}
.ic input:focus-visible+span{outline:2px solid var(--teal);outline-offset:2px}
.prog{font:500 12px/1.6 var(--fm);color:var(--muted)}
dialog.rd{width:100vw;max-width:100vw;height:100dvh;max-height:100dvh;margin:0;border-radius:0}
dialog.rd form{display:flex;flex-direction:column;height:100%}
.rh{display:flex;justify-content:space-between;align-items:center;gap:12px;padding:12px 16px;padding-top:calc(12px + env(safe-area-inset-top));border-bottom:1px solid var(--border)}
.rh b{font:800 20px var(--fd);text-transform:uppercase}
.rb{flex:1;overflow:auto;background:var(--s2);padding:12px;display:flex;flex-direction:column;align-items:flex-start;gap:12px}
.rb img{display:block;width:calc(min(100%,1000px)*var(--z,1));max-width:none;height:auto;margin:0 auto;background:#fff;box-shadow:var(--shadow);flex:none}
.toast{position:fixed;left:50%;bottom:calc(24px + env(safe-area-inset-bottom));transform:translate(-50%,30px);background:var(--text);color:var(--bg);padding:11px 18px;border-radius:12px;font-size:13px;font-weight:600;opacity:0;pointer-events:none;transition:.25s var(--ease);z-index:99}
.toast.on{opacity:1;transform:translate(-50%,0)}

/* ===== Desktop: seluruh tampilan muat satu layar ===== */
@media(min-width:861px){
  body{height:100dvh;min-height:600px}
  main{flex:1;min-height:0;padding-bottom:16px}
  main>.wrap,.layout{height:100%}
  .layout{grid-template-rows:minmax(0,1fr)}
  .side{position:static;align-self:start;max-height:100%;display:flex;flex-direction:column}
  .nav{overflow-y:auto;min-height:0;scrollbar-width:thin}
  .sh,.sinfo,.sadm{flex:none}
  .panel-wrap,#panel{height:100%;min-height:0}
  .pc{height:100%;display:flex;flex-direction:column}
  .pc>.ph,.pc>.abar,.pc>.docs,.pc>.dket{flex:none}
  .pc.empty{justify-content:center;align-items:center}
  .vwrap{flex:1;min-height:0;display:flex;flex-direction:column;padding-bottom:0}
  .frame{flex:1;min-height:0;display:flex;padding:12px}
  .viewer{flex:1;min-width:0;min-height:0}
  .track,.slide{height:100%}
  .slide img{width:100%;height:100%;max-height:none;min-height:0;object-fit:contain}
  .pbar{flex:none;padding:10px 8px 12px}
  .hero{padding:clamp(12px,2.2vh,28px) 0 clamp(12px,2vh,22px)}
  .hero h2{font-size:clamp(34px,5.4vh,56px)}
  .ph{padding:clamp(12px,1.8vh,20px) 24px}
  .foot{padding:10px 0}
}
@media(min-width:861px) and (max-height:820px){
  .hero p{display:none}
  .hero h2{font-size:38px}
  .st{padding:8px 16px}
  .st b{font-size:28px}
  .st svg.i{width:32px;height:32px}
  .pico svg.i{width:40px;height:40px}
  .pt h3{font-size:28px}
}

/* ===== Tablet / HP: kategori pindah ke bawah ===== */
@media(max-width:1060px){
  .hero h2{font-size:46px}
  .st{min-width:0;padding:14px 16px}
}
@media(max-width:860px){
  .wrap{padding:0 16px}
  body{padding-bottom:calc(84px + env(safe-area-inset-bottom))}
  .top .wrap{height:60px;gap:12px}
  .logo span,.vsep,.crumb em,.crumb .prev{display:none}
  .crumb{font-size:14px}
  .topr{gap:6px}
  .chip{height:38px;padding:0 13px}
  .tbtn{width:38px;height:38px}
  .hero{padding:22px 0 16px;gap:16px}
  .hero h2{font-size:38px}
  .hero p{font-size:14px;margin-top:8px}
  .stats{width:100%;display:grid;grid-template-columns:1fr 1fr 1.35fr;gap:10px}
  .st{flex-direction:column;align-items:flex-start;gap:4px;padding:12px 14px;border-radius:14px}
  .st svg.i{display:none}
  .st b{font-size:30px}
  .st small{font-size:12px;margin-top:0}
  .st.dt b{font-size:17px}
  .layout{grid-template-columns:1fr;gap:0}
  .side{position:fixed;left:0;right:0;bottom:0;top:auto;z-index:60;border-radius:22px 22px 0 0;border:0;border-top:1px solid var(--border);box-shadow:0 -10px 34px rgba(8,20,45,.16);padding-bottom:env(safe-area-inset-bottom);background:color-mix(in srgb,var(--surface) 94%,transparent);backdrop-filter:blur(14px);-webkit-backdrop-filter:blur(14px)}
  .sh,.sinfo,.sadm{display:none}
  .nav{flex-direction:row;gap:4px;padding:8px 10px;overflow-x:auto;scrollbar-width:none;overscroll-behavior-x:contain}
  .nav::-webkit-scrollbar{display:none}
  .ind{border-radius:16px}
  .ni{flex:1 0 82px;flex-direction:column;justify-content:center;gap:4px;height:64px;padding:6px 10px;border-radius:16px;font-size:11.5px;font-weight:600;text-align:center}
  .ni .nic{width:auto}.ni .nic svg.i{width:24px;height:24px}
  .ni .nl{flex:none;max-width:100%;line-height:1.15;white-space:normal;display:-webkit-box;-webkit-line-clamp:2;-webkit-box-orient:vertical;overflow:hidden;word-break:break-word}
  .rh{padding:10px 12px;padding-top:calc(10px + env(safe-area-inset-top));gap:8px}
  .rh b{font-size:18px}
  .rh .tools{gap:6px}
  .rh .ib{width:40px;height:40px}
  .rh [data-a="fs"]{display:none}
  .rb{padding:8px;gap:8px}
  .ni .chev{display:none}
  .ni.add{margin-top:0;height:64px;flex:0 0 72px}
  .ni.add .nic svg.i{width:22px;height:22px}
  .ph{padding:16px;gap:12px}

  tools:{l:'Maintenance',p:'<path d="M14.5 6.5a4 4 0 00-5 5L3.5 17.5l3 3 6-6a4 4 0 005-5l-2.5 2.5-2.5-.5-.5-2.5z"/>'},

const autoKey=n=>{n=(n||'').toLowerCase();
  return /struktur|organisasi/.test(n)?'org':/jobdesk|tugas|job/.test(n)?'jobdesk':/denah|layout|peta|area/.test(n)?'map':/support|bantuan|needed|helpdesk/.test(n)?'support':
  /forklift|operator/.test(n)?'fork':/rak|zona|pic/.test(n)?'rack':/safety|k3|apd/.test(n)?'safety':/sop|prosedur/.test(n)?'book':/shift|jadwal/.test(n)?'clock':/laporan|report/.test(n)?'chart':'grid';};
const lsIk=()=>{try{return JSON.parse(localStorage.getItem('sbj.profil.ikon')||'{}');}catch(e){return{};}};
const setLsIk=(id,k)=>{try{const m=lsIk();m[id]=k;localStorage.setItem('sbj.profil.ikon',JSON.stringify(m));}catch(e){}};
const ikKey=t=>[t.ikon,lsIk()[t.id]].find(k=>k&&IK[k])||autoKey(t.nama);
const tabIcon=t=>IK[ikKey(t)].p;
let tt;function toast(m){const el=$('#toast');el.textContent=m;el.classList.add('on');clearTimeout(tt);tt=setTimeout(()=>el.classList.remove('on'),2200);}
const mob=()=>matchMedia('(max-width:860px)').matches;

/* ===== Supabase (sama dengan Temuan 5R5S) ===== */
const SB_URL='https://bpqiejowxcxyeewhoncr.supabase.co',SB_KEY='sb_publishable_3tCR_a01HgzEpH-5uypqGg_s8WvXsa9',BUCKET='profil-dokumen';
const sb=window.supabase?window.supabase.createClient(SB_URL,SB_KEY):null;
let D={tab:[],dok:[]},ses=null,S={tab:null,doc:null,pg:0,loading:true};
const pages=d=>(d.halaman_url||'').split(',').filter(Boolean);
const fileOf=u=>u.split('/').pop();
const curDoc=()=>{const t=D.tab.find(x=>x.id===S.tab);if(!t)return null;const docs=D.dok.filter(d=>d.tab_id===t.id);return docs.find(x=>x.id===S.doc)||docs[0]||null;};

async function load(){
  const [a,b]=await Promise.all([
    sb.from('profil_tab').select('*').order('urutan').order('created_at'),
    sb.from('profil_dokumen').select('*').order('created_at',{ascending:false})]);
  if(a.error||b.error){toast('Gagal memuat: '+(a.error||b.error).message);return;}
  D.tab=a.data;D.dok=b.data;
  if(!D.tab.some(t=>t.id===S.tab)){
    let s=null;try{s=localStorage.getItem('sbj.profil.tab');}catch(e){}
    S.tab=D.tab.some(t=>t.id===s)?s:(D.tab[0]||{}).id||null;
  }
}

/* ===== Auth admin ===== */
function authUI(){
  document.body.classList.toggle('is-admin',!!ses);
  $('#chipTxt').textContent=ses?'ADMIN':'TAMU';
  $('#sideLogin span').textContent=ses?'Keluar Admin':'Masuk Admin';
}
function openLogin(){
  $('#frm').innerHTML=`<div class="mh"><div class="eyebrow">Akses Admin</div><h3>Login Admin</h3></div><div class="mb"><div class="fld w"><label>Email</label><input name="email" type="email" autocomplete="username" required></div><div class="fld w"><label>Password</label><div class="pw"><input name="pw" id="pw" type="password" autocomplete="current-password" required><button type="button" data-a="eye" aria-label="Lihat password">${svg(IC.eye)}</button></div></div><div class="fld w prog" id="msg"></div></div><div class="mf"><button class="btn" type="button" data-a="close">Batal</button><button class="btn pri" type="submit" id="okBtn">Masuk</button></div>`;
  $('#frm').onsubmit=async e=>{
    e.preventDefault();const f=new FormData($('#frm')),b=$('#okBtn');b.disabled=true;$('#msg').textContent='Memproses…';
    const {error}=await sb.auth.signInWithPassword({email:String(f.get('email')).trim(),password:f.get('pw')});
    if(error){$('#msg').textContent='Gagal login: '+error.message;b.disabled=false;return;}

  };
  $('#dlg').showModal();
}
async function loginAction(){
  if(!sb)return toast('Supabase belum termuat, cek koneksi');
  if(!ses)return openLogin();
  if(confirm('Keluar dari akun admin?'))await sb.auth.signOut();
}
$('#loginBtn').onclick=loginAction;$('#sideLogin').onclick=loginAction;

/* ===== Render ===== */
let navSig='';
function render(){renderStats();renderNav(false);renderPanel();}

function renderStats(){
  const p2=n=>String(n).padStart(2,'0');
  const last=D.dok.reduce((m,d)=>d.created_at&&d.created_at>m?d.created_at:m,'');
  const lt=last?new Date(last).toLocaleDateString('id-ID',{day:'numeric',month:'short',year:'numeric'}):'—';
  $('#stats').innerHTML=
   `<div class="st">${svg(IC.folder)}<div><b>${p2(D.tab.length)}</b><small>Kategori Informasi</small></div></div>`+
   `<div class="st">${svg(IC.doc)}<div><b>${p2(D.dok.length)}</b><small>Dokumen</small></div></div>`+
   `<div class="st dt">${svg(IC.cal)}<div><small>Terakhir diperbarui</small><b>${lt}</b></div></div>`;
}

function renderNav(animate){
  const sig=D.tab.map(t=>t.id+'|'+t.nama+'|'+ikKey(t)).join('~');
  if(sig!==navSig){
    navSig=sig;
    $('#navItems').innerHTML=D.tab.map(t=>`<button class="ni" data-t="${t.id}"><span class="nic">${svg(tabIcon(t))}</span><span class="nl">${esc(t.nama)}</span><span class="chev">${svg(IC.r)}</span></button>`).join('')+
      `<button class="ni add adm" data-a="tabadd"><span class="nic">${svg(IC.plus)}</span><span class="nl">Kategori</span></button>`;
  }
  document.querySelectorAll('#navItems .ni[data-t]').forEach(b=>b.classList.toggle('on',b.dataset.t===S.tab));
  moveInd(animate);
}
function moveInd(animate){
  const ind=$('#ind'),el=document.querySelector('#navItems .ni.on'),nav=$('#nav');
  if(!el){ind.style.opacity=0;return;}
  if(!animate)ind.classList.add('noanim');
  ind.style.opacity=1;
  ind.style.width=el.offsetWidth+'px';ind.style.height=el.offsetHeight+'px';
  ind.style.transform=`translate(${el.offsetLeft}px,${el.offsetTop}px)`;
  if(!animate){void ind.offsetWidth;requestAnimationFrame(()=>ind.classList.remove('noanim'));}
  if(mob())nav.scrollTo({left:el.offsetLeft-(nav.clientWidth-el.offsetWidth)/2,behavior:animate?'smooth':'auto'});
}
window.addEventListener('resize',()=>moveInd(false));
if(document.fonts&&document.fonts.ready)document.fonts.ready.then(()=>moveInd(false));

/* Transisi halus saat ganti kategori / dokumen */
let swapT;
function swapPanel(dir){
  const p=$('#panel'),m=mob();
  p.style.setProperty('--ox',m?(-16*dir)+'px':'0px');p.style.setProperty('--oy',m?'0px':(-8*dir)+'px');
  p.style.setProperty('--dx',m?(30*dir)+'px':'0px');p.style.setProperty('--dy',m?'0px':(18*dir)+'px');
  p.classList.remove('in');p.classList.add('out');
  clearTimeout(swapT);
  swapT=setTimeout(()=>{renderPanel();p.classList.remove('out');void p.offsetWidth;p.classList.add('in');},140);
}
function select(id){
  if(id===S.tab)return;
  const a=D.tab.findIndex(x=>x.id===S.tab),b=D.tab.findIndex(x=>x.id===id);
  setTab(id);S.pg=0;renderNav(true);swapPanel(b>=a?1:-1);
}

function renderPanel(){$('#panel').innerHTML=S.loading?`<div class="pc"><div class="sk"></div></div>`:!D.tab.length?noTabs():panel();}
function noTabs(){
  return `<div class="pc empty">${svg(IC.doc)}<p>Belum ada konten. Admin dapat membuat kategori lalu mengupload dokumen.</p>
  <div class="adm qk">${['Struktur Organisasi','Operator Forklift','PIC Zona Rak'].map(n=>`<button class="btn" data-a="tabquick" data-n="${n}">${svg(IC.plus)}${n}</button>`).join('')}<button class="btn pri" data-a="tabadd">${svg(IC.plus)}Kategori Lain</button></div></div>`;
}
function panel(){
  const t=D.tab.find(x=>x.id===S.tab),docs=D.dok.filter(d=>d.tab_id===t.id);
  if(!docs.some(d=>d.id===S.doc))S.doc=(docs[0]||{}).id;
  const d=docs.find(x=>x.id===S.doc),i=D.tab.indexOf(t),p=d?pages(d):[];
  if(S.pg>=p.length)S.pg=0;
  const yr=d&&d.tanggal?new Date(d.tanggal+'T00:00:00').getFullYear():'';
  const head=`<div class="ph"><span class="pico">${svg(tabIcon(t))}</span><div class="pt"><h3>${esc(t.nama)}</h3>
    <div class="meta"><span>${svg(IC.doc)}Dokumen departemen</span>${d?`<span>${svg(IC.doc)}${p.length} halaman</span>`:''}${yr?`<span>${svg(IC.cal)}Berlaku ${yr}</span>`:''}</div></div>
    ${d?`<div class="ptools"><button class="btn out" data-a="read" data-id="${d.id}">${svg(IC.full)}Layar Penuh</button></div>`:''}</div>`;
  const abar=`<div class="abar adm">
    <button class="ib sm" data-a="tabl" aria-label="Geser kiri" title="Geser kategori ke atas/kiri" ${i===0?'disabled':''}>${svg(IC.l)}</button>
    <button class="ib sm" data-a="tabr" aria-label="Geser kanan" title="Geser kategori ke bawah/kanan" ${i===D.tab.length-1?'disabled':''}>${svg(IC.r)}</button>
    <button class="ib sm" data-a="tabedit" aria-label="Ubah nama" title="Ubah nama kategori">${svg(IC.edit)}</button>
    <button class="ib sm dng" data-a="tabdel" aria-label="Hapus kategori" title="Hapus kategori">${svg(IC.del)}</button>
    <span style="flex:1"></span>
    ${d?`<button class="ib sm" data-a="docedit" data-id="${d.id}" aria-label="Ubah dokumen" title="Ubah info dokumen">${svg(IC.doc)}</button><button class="ib sm dng" data-a="docdel" data-id="${d.id}" aria-label="Hapus dokumen" title="Hapus dokumen">${svg(IC.del)}</button>`:''}
    <button class="btn pri" data-a="upload">${svg(IC.up)}Upload Dokumen</button></div>`;
  if(!d)return `<div class="pc">${head}${abar}<div class="empty">${svg(IC.doc)}<p>Belum ada dokumen di kategori ini.</p></div></div>`;
  const chips=docs.length>1?`<div class="docs">${docs.map(x=>`<button class="dchip ${x.id===d.id?'on':''}" data-a="pick" data-id="${x.id}">${esc(x.judul)}</button>`).join('')}</div>`:'';
  const ket=d.ket?`<p class="dket">${esc(d.ket)}</p>`:'';
  return `<div class="pc">${head}${abar}${chips}${ket}
    <div class="vwrap"><div class="frame"><div class="viewer" id="viewer"><div class="track" id="track" style="transform:translateX(${-S.pg*100}%)">${p.map((u,n)=>`<div class="slide"><img src="${esc(u)}" alt="Halaman ${n+1}" ${n<2?'':'loading="lazy"'} onload="this.classList.add('ld')"></div>`).join('')}</div></div></div>
    <div class="pbar"><span id="pgl">Halaman ${S.pg+1} dari ${p.length}</span>${p.length>1?`<div class="tools"><button class="pbtn" id="pprev" data-a="pprev" aria-label="Halaman sebelumnya" ${S.pg===0?'disabled':''}>${svg(IC.l)}</button><button class="pbtn nx" id="pnext" data-a="pnext" aria-label="Halaman berikutnya" ${S.pg>=p.length-1?'disabled':''}>${svg(IC.r)}</button></div>`:''}</div></div></div>`;
}
function go(n){
  const d=curDoc();if(!d)return;const len=pages(d).length;
  S.pg=Math.max(0,Math.min(len-1,n));
  const tr=$('#track');if(tr)tr.style.transform=`translateX(${-S.pg*100}%)`;
  const l=$('#pgl');if(l)l.textContent=`Halaman ${S.pg+1} dari ${len}`;
  const a=$('#pprev'),b=$('#pnext');if(a)a.disabled=S.pg===0;if(b)b.disabled=S.pg>=len-1;
}
/* geser (swipe) antar halaman */
let sx=0,sy=0;
document.addEventListener('touchstart',e=>{if(e.target.closest('#viewer')){sx=e.touches[0].clientX;sy=e.touches[0].clientY;}else sx=0;},{passive:true});
document.addEventListener('touchend',e=>{
  if(!sx||!e.target.closest('#viewer'))return;
  const dx=e.changedTouches[0].clientX-sx,dy=e.changedTouches[0].clientY-sy;
  if(Math.abs(dx)>50&&Math.abs(dx)>Math.abs(dy)*1.4)go(S.pg+(dx<0?1:-1));sx=0;
},{passive:true});
document.addEventListener('keydown',e=>{
  if($('#dlg').open||/INPUT|TEXTAREA/.test((e.target||{}).tagName))return;
  if(e.key==='ArrowRight')go(S.pg+1);else if(e.key==='ArrowLeft')go(S.pg-1);
});

/* ===== Kategori (admin) ===== */
function tabForm(id,preset){
  const t=id?D.tab.find(x=>x.id===id):null;
  const cur=t?ikKey(t):autoKey(preset||'');
  $('#frm').innerHTML=`<div class="mh"><div class="eyebrow">Menu Kategori</div><h3>${t?'Ubah Kategori':'Tambah Kategori'}</h3></div><div class="mb"><div class="fld w"><label>Nama Kategori *</label><input name="nama" id="tnama" value="${esc(t?t.nama:preset||'')}" maxlength="40" required></div>
  <div class="fld w"><label>Ikon</label><div class="icp">${Object.entries(IK).map(([k,v])=>`<label class="ic" title="${esc(v.l)}"><input type="radio" name="ikon" value="${k}" ${k===cur?'checked':''}><span>${svg(v.p)}<small>${esc(v.l)}</small></span></label>`).join('')}</div></div></div><div class="mf"><button class="btn" type="button" data-a="close">Batal</button><button class="btn pri" type="submit">Simpan</button></div>`;
  let touched=!!t;
  $('#frm').querySelectorAll('input[name=ikon]').forEach(r=>r.addEventListener('change',()=>{touched=true;}));
  $('#tnama').addEventListener('input',e=>{if(touched)return;const r=$('#frm').querySelector(`input[name=ikon][value="${autoKey(e.target.value)}"]`);if(r)r.checked=true;});
  $('#frm').onsubmit=async e=>{
    e.preventDefault();const f=new FormData($('#frm')),nama=String(f.get('nama')).trim(),ikon=f.get('ikon')||'grid';
    const run=pl=>t?sb.from('profil_tab').update(pl).eq('id',t.id).select().single():sb.from('profil_tab').insert({...pl,urutan:D.tab.length}).select().single();
    let r=await run({nama,ikon}),warn=false;
    if(r.error&&/ikon/i.test(r.error.message)){r=await run({nama});warn=!r.error;}
    if(r.error)return toast('Gagal menyimpan: '+r.error.message);
    if(r.data)setLsIk(r.data.id,ikon);
    if(!t&&r.data)setTab(r.data.id);
    await load();$('#dlg').close();render();
    toast(warn?"Tersimpan. Kolom 'ikon' belum ada di Supabase, ikon hanya tampil di perangkat ini":'Kategori tersimpan');
  };
  $('#dlg').showModal();
}
function setTab(id){S.tab=id;S.doc=null;try{localStorage.setItem('sbj.profil.tab',id);}catch(e){}}
async function tabMove(dir){
  const a=[...D.tab],i=a.findIndex(x=>x.id===S.tab),j=i+dir;if(j<0||j>=a.length)return;
  [a[i],a[j]]=[a[j],a[i]];
  await Promise.all(a.map((x,n)=>x.urutan===n?null:sb.from('profil_tab').update({urutan:n}).eq('id',x.id)));
  await load();navSig='';renderNav(false);renderPanel();
}
async function tabDel(){
  const t=D.tab.find(x=>x.id===S.tab),docs=D.dok.filter(d=>d.tab_id===t.id);
  if(!confirm(`Hapus kategori "${t.nama}" beserta ${docs.length} dokumen di dalamnya? Tidak bisa dibatalkan.`))return;
  const f=docs.flatMap(d=>pages(d).map(fileOf));
  if(f.length){const {error}=await sb.storage.from(BUCKET).remove(f);if(error)console.warn(error.message);}
  const {error}=await sb.from('profil_tab').delete().eq('id',t.id);
  if(error)return toast('Gagal menghapus: '+error.message);
  S.tab=null;await load();render();toast('Kategori dihapus');
}

/* ===== Dokumen ===== */
function docForm(id){
  const d=D.dok.find(x=>x.id===id);
  $('#frm').innerHTML=`<div class="mh"><div class="eyebrow">Dokumen</div><h3>Ubah Info Dokumen</h3></div><div class="mb"><div class="fld w"><label>Judul *</label><input name="judul" value="${esc(d.judul)}" required></div><div class="fld w"><label>Tanggal Berlaku</label><input name="tanggal" type="date" value="${esc(d.tanggal||'')}"></div><div class="fld w"><label>Keterangan</label><textarea name="ket">${esc(d.ket||'')}</textarea></div></div><div class="mf"><button class="btn" type="button" data-a="close">Batal</button><button class="btn pri" type="submit">Simpan</button></div>`;
  $('#frm').onsubmit=async e=>{
    e.preventDefault();const f=new FormData($('#frm'));
    const {error}=await sb.from('profil_dokumen').update({judul:String(f.get('judul')).trim(),tanggal:f.get('tanggal')||null,ket:String(f.get('ket')).trim()||null}).eq('id',id);
    if(error)return toast('Gagal menyimpan: '+error.message);
    await load();$('#dlg').close();render();toast('Tersimpan');
  };
  $('#dlg').showModal();
}
async function docDel(id){
  const d=D.dok.find(x=>x.id===id);
  if(!confirm(`Hapus dokumen "${d.judul}"?`))return;
  const f=pages(d).map(fileOf);
  if(f.length){const {error}=await sb.storage.from(BUCKET).remove(f);if(error)console.warn(error.message);}
  const {error}=await sb.from('profil_dokumen').delete().eq('id',id);
  if(error)return toast('Gagal menghapus: '+error.message);
  S.doc=null;S.pg=0;await load();render();toast('Dokumen dihapus');
}

/* Upload PDF -> WebP per halaman (maks. 500 KB) */
const PDFJS='https://cdnjs.cloudflare.com/ajax/libs/pdf.js/3.11.174/',MAXB=500*1024,MAXW=1700;
function loadPdfjs(){
  return window.pdfjsLib?Promise.resolve():new Promise((ok,no)=>{
    const s=document.createElement('script');s.src=PDFJS+'pdf.min.js';
    s.onload=()=>{pdfjsLib.GlobalWorkerOptions.workerSrc=PDFJS+'pdf.worker.min.js';ok();};
    s.onerror=()=>no(new Error('pdf.js gagal dimuat, cek koneksi'));document.head.appendChild(s);
  });
}
const toBlob=(c,t,q)=>new Promise(r=>c.toBlob(r,t,q));
async function encode(cv){
  const t=cv.toDataURL('image/webp').startsWith('data:image/webp')?'image/webp':'image/jpeg';
  let c=cv,b;
  for(let n=0;n<4;n++){
    for(let q=.86;q>=.5;q-=.08){b=await toBlob(c,t,q);if(b.size<=MAXB)return{b,t};}
    const x=document.createElement('canvas');x.width=Math.round(c.width*.85);x.height=Math.round(c.height*.85);
    x.getContext('2d').drawImage(c,0,0,x.width,x.height);c=x;
  }
  return{b,t};
}
function openUpload(){
  $('#frm').innerHTML=`<div class="mh"><div class="eyebrow">${esc(D.tab.find(x=>x.id===S.tab).nama)}</div><h3>Upload Dokumen</h3></div><div class="mb">
  <div class="fld w"><label>File PDF *</label><input name="pdf" id="pdf" type="file" accept="application/pdf" required></div>
  <div class="fld w"><label>Judul *</label><input name="judul" id="jdl" required></div>
  <div class="fld w"><label>Tanggal Berlaku</label><input name="tanggal" type="date"></div>
  <div class="fld w"><label>Keterangan</label><textarea name="ket"></textarea></div>
  <div class="fld w prog" id="prog">Tiap halaman diubah ke WebP (maks. 500 KB) lalu disimpan per halaman.</div></div>
  <div class="mf"><button class="btn" type="button" data-a="close">Batal</button><button class="btn pri" type="submit" id="upBtn">Upload</button></div>`;
  $('#pdf').onchange=e=>{const f=e.target.files[0];if(f&&!$('#jdl').value)$('#jdl').value=f.name.replace(/\.pdf$/i,'');};
  $('#frm').onsubmit=e=>{e.preventDefault();doUpload(new FormData($('#frm')));};
  $('#dlg').showModal();
}
async function doUpload(fd){
  const prog=$('#prog'),btn=$('#upBtn'),done=[],urls=[];btn.disabled=true;
  try{
    await loadPdfjs();
    const pdf=await pdfjsLib.getDocument({data:await fd.get('pdf').arrayBuffer()}).promise;
    const stamp=Date.now()+'_'+Math.random().toString(36).slice(2,6);
    for(let i=1;i<=pdf.numPages;i++){
      prog.textContent=`Memproses halaman ${i} dari ${pdf.numPages}…`;
      const pg=await pdf.getPage(i),v0=pg.getViewport({scale:1}),vp=pg.getViewport({scale:Math.min(3,MAXW/v0.width)});
      const cv=document.createElement('canvas');cv.width=Math.round(vp.width);cv.height=Math.round(vp.height);
      const cx=cv.getContext('2d');cx.fillStyle='#fff';cx.fillRect(0,0,cv.width,cv.height);
      await pg.render({canvasContext:cx,viewport:vp}).promise;
      const {b,t}=await encode(cv),name=`${stamp}_p${String(i).padStart(3,'0')}.${t==='image/webp'?'webp':'jpg'}`;
      const {error}=await sb.storage.from(BUCKET).upload(name,b,{contentType:t,cacheControl:'31536000'});
      if(error)throw error;
      done.push(name);urls.push(sb.storage.from(BUCKET).getPublicUrl(name).data.publicUrl);
    }
    const {data,error}=await sb.from('profil_dokumen').insert({tab_id:S.tab,judul:String(fd.get('judul')).trim(),tanggal:fd.get('tanggal')||null,ket:String(fd.get('ket')).trim()||null,halaman_url:urls.join(',')}).select().single();
    if(error)throw error;
    S.doc=data.id;S.pg=0;await load();$('#dlg').close();render();toast(`Dokumen tersimpan (${urls.length} halaman)`);
  }catch(e){
    if(done.length)await sb.storage.from(BUCKET).remove(done);
    prog.textContent='Gagal: '+(e.message||e);btn.disabled=false;
  }
}

/* Layar penuh */
function openReader(id){
  const d=D.dok.find(x=>x.id===id),p=pages(d);
  $('#frm').innerHTML=`<div class="rh"><div><div class="eyebrow">${p.length} halaman</div><b>${esc(d.judul)}</b></div><div class="tools"><button class="ib" type="button" data-a="zout" aria-label="Perkecil">−</button><button class="ib" type="button" data-a="zin" aria-label="Perbesar">+</button>${document.fullscreenEnabled?`<button class="ib" type="button" data-a="fs" aria-label="Layar penuh perangkat" title="Layar penuh perangkat">${svg(IC.full)}</button>`:''}<button class="ib" type="button" data-a="close" aria-label="Tutup">✕</button></div></div><div class="rb" id="rb">${p.map((u,n)=>`<img src="${esc(u)}" loading="lazy" alt="Halaman ${n+1}">`).join('')}</div>`;
  $('#frm').onsubmit=null;zoom.v=100;$('#dlg').classList.add('rd');$('#dlg').showModal();
}
function zoom(n){zoom.v=Math.max(50,Math.min(250,(zoom.v||100)+n));$('#rb').style.setProperty('--z',zoom.v/100);}
$('#dlg').addEventListener('close',()=>{$('#dlg').classList.remove('rd');if(document.fullscreenElement)document.exitFullscreen();});

/* ===== Event ===== */
document.addEventListener('click',async e=>{
  const t=e.target.closest('[data-t]');
  if(t){select(t.dataset.t);return;}
  const b=e.target.closest('[data-a]');if(!b||b.disabled)return;
  const a=b.dataset.a,id=b.dataset.id;
  if(a==='close')$('#dlg').close();
  else if(a==='pick'){if(id!==S.doc){S.doc=id;S.pg=0;swapPanel(1);}}
  else if(a==='pprev')go(S.pg-1);
  else if(a==='pnext')go(S.pg+1);
  else if(a==='read')openReader(id);
  else if(a==='zin')zoom(20);
  else if(a==='zout')zoom(-20);
  else if(a==='fs'){document.fullscreenElement?document.exitFullscreen():$('#dlg').requestFullscreen().catch(()=>{});}
  else if(a==='eye'){const i=$('#pw');i.type=i.type==='password'?'text':'password';}
  else if(a==='tabadd')tabForm();
  else if(a==='tabquick')tabForm(null,b.dataset.n);
  else if(a==='tabedit')tabForm(S.tab);
  else if(a==='tabdel')tabDel();
  else if(a==='tabl')tabMove(-1);
  else if(a==='tabr')tabMove(1);
  else if(a==='upload')openUpload();
  else if(a==='docedit')docForm(id);
  else if(a==='docdel')docDel(id);
});

/* ===== Tema ===== */
function setTheme(t,sv){
  document.documentElement.dataset.theme=t;
  $('#themeBtn').firstElementChild.innerHTML=t==='dark'?IC.sun:IC.moon;
  if(sv)try{localStorage.setItem('stockopname.theme',t);}catch(e){}
}
$('#themeBtn').addEventListener('click',()=>setTheme(document.documentElement.dataset.theme==='dark'?'light':'dark',true));
setTheme(document.documentElement.dataset.theme,false);

async function init(){
  authUI();render();
  if(!sb){toast('Supabase tidak dapat dimuat, cek koneksi');S.loading=false;render();return;}
  sb.auth.getSession().then(({data})=>{ses=data.session;authUI();});
  sb.auth.onAuthStateChange((_e,x)=>{ses=x;authUI();});
  await load();S.loading=false;render();
  $('#panel').classList.add('in');
}
init();
if('serviceWorker' in navigator)window.addEventListener('load',()=>navigator.serviceWorker.register('sw.js').catch(()=>{}));
</script>
