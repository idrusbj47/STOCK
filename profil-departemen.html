<style>
:root{
  --bg:#f4f7fb; --surface:#fff; --s2:#f8fafc; --border:#e2e8f0; --text:#0f172a; --muted:#64748b;
  --brand:#2563eb; --ind:#4f46e5; --green:#15803d; --amber:#b45309; --red:#dc2626;
  --gbg:rgba(22,163,74,.12); --abg:rgba(217,119,6,.14); --rbg:rgba(220,38,38,.12);
  --shadow:0 20px 50px rgba(15,23,42,.08),0 3px 10px rgba(15,23,42,.03);
  --fd:'Barlow Condensed',sans-serif; --fb:'Inter',sans-serif; --fm:'JetBrains Mono',monospace;
  color-scheme:light;
}
html[data-theme="dark"]{
  --bg:#0b1220; --surface:#111827; --s2:#162033; --border:#253248; --text:#f8fafc; --muted:#94a3b8;
  --brand:#60a5fa; --ind:#818cf8; --green:#34d399; --amber:#fbbf24; --red:#f87171;
  --gbg:rgba(52,211,153,.14); --abg:rgba(251,191,36,.14); --rbg:rgba(248,113,113,.14);
  --shadow:0 24px 60px rgba(0,0,0,.28),0 2px 8px rgba(0,0,0,.14); color-scheme:dark;
}
*{box-sizing:border-box}
html{min-height:100%}
body{margin:0;font-family:var(--fb);color:var(--text);background:var(--bg);-webkit-font-smoothing:antialiased;
  background-image:linear-gradient(var(--border) 1px,transparent 1px),linear-gradient(90deg,var(--border) 1px,transparent 1px);
  background-size:44px 44px;background-attachment:fixed;padding-bottom:env(safe-area-inset-bottom)}
body::before{content:"";position:fixed;inset:0;background:radial-gradient(ellipse at top,transparent 0,var(--bg) 78%);opacity:.93;z-index:-1}
button,input,select,textarea{font:inherit;color:inherit}
.wrap{max-width:1080px;margin:0 auto;padding:0 18px}

/* header */
.top{position:sticky;top:0;z-index:50;background:color-mix(in srgb,var(--bg) 86%,transparent);backdrop-filter:blur(12px);-webkit-backdrop-filter:blur(12px);border-bottom:1px solid var(--border);padding-top:env(safe-area-inset-top)}
.top .wrap{display:flex;align-items:center;gap:12px;height:64px}
.ib{width:40px;height:40px;border-radius:12px;border:1px solid var(--border);background:var(--surface);display:inline-flex;align-items:center;justify-content:center;cursor:pointer;color:var(--text);flex:none;text-decoration:none}
.ib:hover{border-color:var(--brand);color:var(--brand)}
.ib svg,.btn svg{width:19px;height:19px;fill:none;stroke:currentColor;stroke-width:2;stroke-linecap:round;stroke-linejoin:round}
.brand{flex:1;min-width:0;line-height:1}
.eyebrow{font:500 10px var(--fm);letter-spacing:.2em;text-transform:uppercase;color:var(--muted)}
.brand h1{margin:5px 0 0;font:800 25px/1 var(--fd);letter-spacing:.01em;text-transform:uppercase}
.brand h1 span{color:var(--ind)}

/* hero */
.hero{padding:30px 0 6px;display:flex;flex-wrap:wrap;gap:16px;align-items:flex-end;justify-content:space-between}
.hero h2{margin:8px 0 0;font:800 42px/1 var(--fd);text-transform:uppercase}
.hero h2 span{color:var(--ind)}
.hero p{margin:10px 0 0;color:var(--muted);font-size:14px;max-width:560px;line-height:1.55}
.tools{display:flex;gap:8px;flex-wrap:wrap}
.btn{display:inline-flex;align-items:center;gap:8px;height:40px;padding:0 15px;border-radius:12px;border:1px solid var(--border);background:var(--surface);cursor:pointer;font-weight:600;font-size:13px;white-space:nowrap}
.btn:hover{border-color:var(--ind)}
.btn.pri{background:var(--ind);border-color:var(--ind);color:#fff}
.btn.pri:hover{filter:brightness(1.08)}
.btn.dng{color:var(--red)}
.btn svg{width:17px;height:17px}

/* tabs */
.tabs{position:sticky;top:calc(64px + env(safe-area-inset-top));z-index:40;margin-top:18px;background:color-mix(in srgb,var(--bg) 90%,transparent);backdrop-filter:blur(10px);-webkit-backdrop-filter:blur(10px);border-bottom:1px solid var(--border)}
.tabs .wrap{display:flex;gap:4px;overflow-x:auto;scrollbar-width:none}
.tabs .wrap::-webkit-scrollbar{display:none}
.tab{flex:none;border:0;background:none;cursor:pointer;padding:15px 16px 13px;font:700 17px var(--fd);letter-spacing:.03em;text-transform:uppercase;color:var(--muted);border-bottom:3px solid transparent}
.tab:hover{color:var(--text)}
.tab.on{color:var(--ind);border-color:var(--ind)}
.tab small{font:500 10px var(--fm);margin-left:6px;background:var(--s2);border:1px solid var(--border);border-radius:99px;padding:2px 7px;color:var(--muted);vertical-align:2px}

main{padding:24px 0 70px}

.bar{display:flex;gap:10px;flex-wrap:wrap;align-items:center;justify-content:space-between;margin-bottom:16px}

.search{height:40px;min-width:220px;padding:0 14px;border-radius:12px;border:1px solid var(--border);background:var(--surface);outline:none}
.search:focus,.fld input:focus,.fld select:focus,.fld textarea:focus{border-color:var(--ind);box-shadow:0 0 0 3px color-mix(in srgb,var(--ind) 18%,transparent)}

.kpi{padding:18px 18px 16px;position:relative;overflow:hidden;cursor:pointer;transition:transform .15s}
.kpi:hover{transform:translateY(-3px)}
.kpi::after{content:"";position:absolute;left:0;top:0;bottom:0;width:4px;background:var(--c,var(--ind))}

.grid2{display:grid;grid-template-columns:1fr 1fr;gap:14px}
.panel{padding:18px 20px}

.li{display:flex;justify-content:space-between;gap:10px;align-items:center;padding:10px 0;border-top:1px solid var(--border);font-size:14px}

.none{color:var(--muted);font-size:13px;padding:6px 0}

/* table */
.tw{overflow-x:auto;border-radius:18px}
table{width:100%;border-collapse:collapse;min-width:760px;font-size:14px}
th{position:sticky;top:0;text-align:left;font:600 10.5px var(--fm);letter-spacing:.1em;text-transform:uppercase;color:var(--muted);background:var(--s2);padding:13px 16px;border-bottom:1px solid var(--border);white-space:nowrap}
td{padding:13px 16px;border-bottom:1px solid var(--border);vertical-align:middle}
tbody tr:last-child td{border-bottom:0}
tbody tr:hover{background:var(--s2)}

td small{display:block;color:var(--muted);font:500 11.5px var(--fm);margin-top:3px}
.act{white-space:nowrap;text-align:right}
.act button{width:34px;height:34px;border-radius:10px;border:1px solid transparent;background:none;cursor:pointer;color:var(--muted)}

.act svg{width:17px;height:17px;fill:none;stroke:currentColor;stroke-width:2;stroke-linecap:round;stroke-linejoin:round}
.bd{display:inline-block;padding:4px 10px;border-radius:99px;font:600 11.5px var(--fb);white-space:nowrap}
.bd.green{background:var(--gbg);color:var(--green)}
.bd.amber{background:var(--abg);color:var(--amber)}
.bd.red{background:var(--rbg);color:var(--red)}
.bd.mute{background:var(--s2);color:var(--muted);border:1px solid var(--border)}
.zn{display:inline-flex;min-width:46px;height:34px;padding:0 10px;align-items:center;justify-content:center;border-radius:10px;background:color-mix(in srgb,var(--ind) 13%,transparent);color:var(--ind);font:700 17px var(--fd);letter-spacing:.04em}

/* tree */
.tree,.tree ul{list-style:none;margin:0;padding:0}
.tree ul{margin-left:24px;padding-left:20px;border-left:2px solid var(--border)}
.tree li{position:relative;padding-top:12px}
.tree ul>li::before{content:"";position:absolute;left:-20px;top:41px;width:20px;border-top:2px solid var(--border)}
.node{display:flex;gap:13px;align-items:center;max-width:560px;padding:13px 14px;border-left:4px solid var(--ind);border-radius:14px}
.lv0>.node{border-left-color:var(--brand);background:linear-gradient(135deg,color-mix(in srgb,var(--brand) 9%,var(--surface)),var(--surface))}
.av{flex:none;width:44px;height:44px;border-radius:50%;background:linear-gradient(135deg,var(--ind),var(--brand));color:#fff;display:flex;align-items:center;justify-content:center;font:700 16px var(--fd);letter-spacing:.04em}
.nm{flex:1;min-width:0}
.nm b{display:block;font-weight:600;font-size:15px}
.nm span{display:block;color:var(--muted);font-size:12.5px;margin-top:2px}
.nm small{font:500 11px var(--fm);color:var(--ind)}

/* empty */
.empty{text-align:center;padding:56px 20px;color:var(--muted)}
.empty svg{width:46px;height:46px;fill:none;stroke:var(--ind);stroke-width:1.5;opacity:.7;margin-bottom:10px}
.empty p{margin:0 0 16px;font-size:14px}
.note{margin-top:18px;font:500 11.5px/1.6 var(--fm);color:var(--muted);text-align:center;letter-spacing:.02em}

/* modal */
dialog{border:0;padding:0;border-radius:20px;background:var(--surface);color:var(--text);width:min(520px,calc(100vw - 28px));box-shadow:0 30px 80px rgba(0,0,0,.35)}
dialog::backdrop{background:rgba(8,13,25,.55);backdrop-filter:blur(3px)}
.mh{padding:20px 22px 4px}
.mh h3{margin:0;font:800 26px var(--fd);text-transform:uppercase}
.mb{padding:10px 22px;display:grid;grid-template-columns:1fr 1fr;gap:12px;max-height:62vh;overflow:auto}
.fld{display:flex;flex-direction:column;gap:6px}
.fld.w{grid-column:1/-1}
.fld label{font:600 10.5px var(--fm);letter-spacing:.08em;text-transform:uppercase;color:var(--muted)}
.fld input,.fld select,.fld textarea{width:100%;min-height:42px;padding:9px 12px;border-radius:11px;border:1px solid var(--border);background:var(--s2);outline:none;font-size:16px}
.fld textarea{min-height:84px;resize:vertical}
.mf{display:flex;justify-content:flex-end;gap:8px;padding:14px 22px 20px}
.toast{position:fixed;left:50%;bottom:calc(24px + env(safe-area-inset-bottom));transform:translate(-50%,30px);background:var(--text);color:var(--bg);padding:11px 18px;border-radius:12px;font-size:13px;font-weight:600;opacity:0;pointer-events:none;transition:.25s;z-index:99}
.toast.on{opacity:1;transform:translate(-50%,0)}

.adm{display:none!important}body.is-admin .adm{display:inline-flex!important}
body:not(.is-admin) .act,body:not(.is-admin) th.ac{display:none}
.chip{font:600 10.5px var(--fm);padding:6px 11px;border-radius:99px;background:var(--s2);border:1px solid var(--border);color:var(--muted);letter-spacing:.08em}
body.is-admin .chip{background:var(--gbg);color:var(--green);border-color:transparent}
.dgrid{display:grid;grid-template-columns:repeat(auto-fill,minmax(250px,1fr));gap:16px}
.dcard{overflow:hidden;display:flex;flex-direction:column}
.thumb{position:relative;aspect-ratio:3/4;max-height:290px;width:100%;background:var(--s2);cursor:pointer;overflow:hidden;border-bottom:1px solid var(--border)}
.thumb img{width:100%;height:100%;object-fit:cover;object-position:top}
.thumb .bd{position:absolute;right:10px;bottom:10px;background:var(--surface)}
.dinfo{padding:14px 16px;display:flex;flex-direction:column;gap:5px}
.dinfo b{font-weight:600}.dinfo small{color:var(--muted);font:500 11.5px var(--fm)}.dinfo span{font-size:13px;color:var(--muted)}
.drow{display:flex;justify-content:space-between;align-items:center;margin-top:8px}
dialog.rd{width:min(960px,100vw);height:100dvh;max-height:100dvh;border-radius:0}
dialog.rd form{display:flex;flex-direction:column;height:100%}
.rh{display:flex;justify-content:space-between;align-items:center;gap:12px;padding:14px 18px;padding-top:calc(14px + env(safe-area-inset-top));border-bottom:1px solid var(--border)}
.rh b{font:800 20px var(--fd);text-transform:uppercase}
.rb{flex:1;overflow:auto;background:var(--s2);padding:12px;display:flex;flex-direction:column;align-items:flex-start;gap:12px}
.rb img{display:block;width:100%;height:auto;margin:0 auto;background:#fff;box-shadow:var(--shadow);flex:none}
.prog{font:500 12px/1.6 var(--fm);color:var(--muted)}
@media(max-width:760px){
  .kpis{grid-template-columns:1fr 1fr}.grid2{grid-template-columns:1fr}
  .hero h2{font-size:34px}.mb{grid-template-columns:1fr}.search{flex:1;min-width:0}
  .tools .btn span{display:none}.tools .btn{padding:0 12px}
}
@media print{
  body{background:#fff;color:#000}body::before,.top,.tabs,.tools,.bar .btn,.bar .search,.act,.note,.toast{display:none!important}
  .card{box-shadow:none}main{padding:0}.tw{overflow:visible}table{min-width:0}
}
</style>

<script>
const $=s=>document.querySelector(s);
const esc=s=>String(s==null?'':s).replace(/[&<>"]/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[c]));

  moon:'<path d="M21 12.79A9 9 0 1 1 11.21 3 7 7 0 0 0 21 12.79z"/>',

};
const svg=p=>`<svg viewBox="0 0 24 24">${p}</svg>`;

/* ===== Supabase (cara yang sama dengan Temuan 5R5S) ===== */
const SB_URL='https://bpqiejowxcxyeewhoncr.supabase.co',SB_KEY='sb_publishable_3tCR_a01HgzEpH-5uypqGg_s8WvXsa9',BUCKET='profil-dokumen';
const sb=window.supabase?window.supabase.createClient(SB_URL,SB_KEY):null;
const T={org:'profil_org',fork:'profil_forklift',zona:'profil_zona',info:'profil_info',dok:'profil_dokumen'};
let D={org:[],fork:[],zona:[],info:[],dok:[]},ses=null;
async function load(k){
  const {data,error}=await sb.from(T[k]).select('*').order('created_at',{ascending:k!=='dok'});
  if(error){toast('Gagal memuat '+CFG[k].title+': '+error.message);return;}
  D[k]=data||[];
}
const loadAll=()=>Promise.all(Object.keys(T).map(load));
async function saveRow(k,id,obj){
  const row={};Object.keys(obj).forEach(x=>row[x]=obj[x]===''?null:obj[x]);
  const {error}=await (id?sb.from(T[k]).update(row).eq('id',id):sb.from(T[k]).insert(row));
  if(error){toast('Gagal menyimpan: '+error.message);return false;}
  await load(k);return true;
}
/* Auth admin */
function authUI(){
  document.body.classList.toggle('is-admin',!!ses);
  $('#chip').textContent=ses?'ADMIN':'TAMU';
  $('#loginBtn').firstElementChild.innerHTML=ses?IC.unlock:IC.lock;
}
function openLogin(){
  $('#frm').innerHTML=`<div class="mh"><div class="eyebrow">Akses Admin</div><h3>Login Admin</h3></div><div class="mb"><div class="fld w"><label>Email</label><input name="email" type="email" autocomplete="username" required></div><div class="fld w"><label>Password</label><input name="pw" type="password" autocomplete="current-password" required></div></div><div class="mf"><button class="btn" type="button" data-a="close">Batal</button><button class="btn pri" type="submit">Masuk</button></div>`;
  $('#frm').onsubmit=async e=>{
    e.preventDefault();const f=new FormData($('#frm'));
    const {error}=await sb.auth.signInWithPassword({email:String(f.get('email')).trim(),password:f.get('pw')});

    $('#dlg').close();toast('Berhasil masuk');
  };
  $('#dlg').showModal();
}
$('#loginBtn').onclick=async()=>{
  if(!sb)return toast('Supabase belum termuat');
  if(!ses)return openLogin();
  if(confirm('Keluar dari akun admin?'))await sb.auth.signOut();
};
/* Dokumen: PDF -> gambar WebP per halaman */
const PDFJS='https://cdnjs.cloudflare.com/ajax/libs/pdf.js/3.11.174/',MAXB=500*1024,MAXW=1700;
function loadPdfjs(){
  return window.pdfjsLib?Promise.resolve():new Promise((ok,no)=>{
    const s=document.createElement('script');s.src=PDFJS+'pdf.min.js';
    s.onload=()=>{pdfjsLib.GlobalWorkerOptions.workerSrc=PDFJS+'pdf.worker.min.js';ok();};
    s.onerror=()=>no(new Error('pdf.js gagal dimuat, cek koneksi'));document.head.appendChild(s);
  });
}
const toBlob=(c,t,q)=>new Promise(r=>c.toBlob(r,t,q));
async function encode(cv){
  const t=cv.toDataURL('image/webp').startsWith('data:image/webp')?'image/webp':'image/jpeg';
  let c=cv,b;
  for(let n=0;n<4;n++){
    for(let q=.86;q>=.5;q-=.08){b=await toBlob(c,t,q);if(b.size<=MAXB)return{b,t};}
    const x=document.createElement('canvas');x.width=Math.round(c.width*.85);x.height=Math.round(c.height*.85);
    x.getContext('2d').drawImage(c,0,0,x.width,x.height);c=x;
  }
  return{b,t};
}
function openUpload(){
  $('#frm').innerHTML=`<div class="mh"><div class="eyebrow">Dokumen</div><h3>Upload PDF</h3></div><div class="mb">
  <div class="fld w"><label>File PDF *</label><input name="pdf" type="file" accept="application/pdf" required></div>

  <div class="fld"><label>Kategori</label><select name="kat"><option>Struktur Organisasi</option><option>Jobdesk</option><option>SOP</option><option>Lainnya</option></select></div>
  <div class="fld"><label>Tanggal Berlaku</label><input name="tanggal" type="date"></div>
  <div class="fld w"><label>Keterangan</label><textarea name="ket"></textarea></div>
  <div class="fld w prog" id="prog">Tiap halaman diubah ke WebP (maks. 500 KB) lalu disimpan per halaman.</div></div>
  <div class="mf"><button class="btn" type="button" data-a="close">Batal</button><button class="btn pri" type="submit" id="upBtn">Upload</button></div>`;
  $('#frm').onsubmit=e=>{e.preventDefault();doUpload(new FormData($('#frm')));};
  $('#dlg').showModal();
}
async function doUpload(fd){
  const prog=$('#prog'),btn=$('#upBtn'),done=[],urls=[];btn.disabled=true;
  try{
    await loadPdfjs();
    const pdf=await pdfjsLib.getDocument({data:await fd.get('pdf').arrayBuffer()}).promise;
    const stamp=Date.now()+'_'+Math.random().toString(36).slice(2,6);
    for(let i=1;i<=pdf.numPages;i++){
      prog.textContent=`Memproses halaman ${i} dari ${pdf.numPages}…`;
      const pg=await pdf.getPage(i),v0=pg.getViewport({scale:1}),vp=pg.getViewport({scale:Math.min(3,MAXW/v0.width)});
      const cv=document.createElement('canvas');cv.width=Math.round(vp.width);cv.height=Math.round(vp.height);
      const cx=cv.getContext('2d');cx.fillStyle='#fff';cx.fillRect(0,0,cv.width,cv.height);
      await pg.render({canvasContext:cx,viewport:vp}).promise;
      const {b,t}=await encode(cv),name=`${stamp}_p${String(i).padStart(3,'0')}.${t==='image/webp'?'webp':'jpg'}`;
      const {error}=await sb.storage.from(BUCKET).upload(name,b,{contentType:t,cacheControl:'31536000'});
      if(error)throw error;
      done.push(name);urls.push(sb.storage.from(BUCKET).getPublicUrl(name).data.publicUrl);
    }
    const {error}=await sb.from(T.dok).insert({judul:String(fd.get('judul')).trim(),kat:fd.get('kat')||null,tanggal:fd.get('tanggal')||null,ket:String(fd.get('ket')).trim()||null,halaman_url:urls.join(',')});
    if(error)throw error;
    await load('dok');$('#dlg').close();render();toast(`Dokumen tersimpan (${urls.length} halaman)`);
  }catch(e){
    if(done.length)await sb.storage.from(BUCKET).remove(done);
    prog.textContent='Gagal: '+(e.message||e);btn.disabled=false;
  }
}
const pages=d=>(d.halaman_url||'').split(',').filter(Boolean);
function dokView(){
  const bar=`<div class="bar"><h3>Dokumen<em>${D.dok.length} berkas</em></h3><div class="tools"><button class="btn pri adm" data-a="add" data-k="dok">${svg(IC.up)}Upload PDF</button></div></div>`;
  if(!D.dok.length)return bar+`<div class="card empty"><p>Belum ada dokumen. Admin dapat upload PDF; tiap halaman disimpan sebagai gambar.</p></div>`;
  return bar+`<div class="dgrid">${D.dok.map(d=>{const p=pages(d);return `<article class="card dcard"><div class="thumb" data-a="read" data-id="${d.id}">${p[0]?`<img src="${esc(p[0])}" loading="lazy" alt="">`:''}<span class="bd mute">${p.length} hal</span></div><div class="dinfo"><b>${esc(d.judul)}</b><small>${esc(d.kat)||'—'} · ${fmt(d.tanggal)}</small>${d.ket?`<span>${esc(d.ket)}</span>`:''}<div class="drow"><button class="btn" data-a="read" data-id="${d.id}">Buka</button><span class="act">${acts('dok',d.id)}</span></div></div></article>`}).join('')}</div>`;
}
function openReader(id){
  const d=D.dok.find(x=>x.id===id),p=pages(d);
  $('#frm').innerHTML=`<div class="rh"><div><div class="eyebrow">${esc(d.kat)||'Dokumen'} · ${p.length} halaman</div><b>${esc(d.judul)}</b></div><div class="tools"><button class="ib" type="button" data-a="zout" aria-label="Perkecil">−</button><button class="ib" type="button" data-a="zin" aria-label="Perbesar">+</button><button class="ib" type="button" data-a="close" aria-label="Tutup">✕</button></div></div><div class="rb" id="rb">${p.map((u,i)=>`<img src="${esc(u)}" loading="lazy" alt="Halaman ${i+1}">`).join('')}</div>`;
  $('#frm').onsubmit=null;$('#dlg').classList.add('rd');$('#dlg').showModal();
}
function zoom(n){const w=Math.max(60,Math.min(220,(zoom.v||100)+n));zoom.v=w;document.querySelectorAll('#rb img').forEach(i=>i.style.width=w+'%');}
$('#dlg').addEventListener('close',()=>{$('#dlg').classList.remove('rd');zoom.v=100;});

/* ===== Helper ===== */
const fmt=d=>d?new Date(d+'T00:00:00').toLocaleDateString('id-ID',{day:'2-digit',month:'short',year:'numeric'}):'—';
function sio(d){
  if(!d) return {t:'Belum diisi',c:'mute',n:null};
  const n=Math.round((new Date(d+'T00:00:00')-new Date().setHours(0,0,0,0))/864e5);
  if(n<0) return {t:'Kadaluarsa',c:'red',n};
  if(n<=90) return {t:n+' hari lagi',c:'amber',n};
  return {t:'Berlaku',c:'green',n};
}
const orgName=id=>(D.org.find(o=>o.id===id)||{}).nama||'';
const ini=n=>String(n||'?').trim().split(/\s+/).slice(0,2).map(w=>w[0]).join('').toUpperCase();
const people=()=>[...new Set([...D.org,...D.fork].map(p=>p.nama).filter(Boolean))];

/* ===== Konfigurasi koleksi ===== */
const CFG={
  org:{title:'Struktur Organisasi',one:'Anggota',fields:[
    {k:'nama',l:'Nama',req:1},{k:'jabatan',l:'Jabatan',req:1},
    {k:'atasan',l:'Melapor ke',t:'ref'},{k:'hp',l:'No. HP / WA',t:'tel'}]},
  fork:{title:'Operator Forklift',one:'Operator',
    fields:[
    {k:'nama',l:'Nama Operator',req:1},{k:'nik',l:'NIK / ID Karyawan'},
    {k:'unit',l:'No. Unit Forklift'},{k:'jenis',l:'Jenis Unit',t:'sel',o:['Counterbalance','Reach Truck','Hand Pallet','Stacker','Lainnya']},
    {k:'sio',l:'No. SIO'},{k:'kelas',l:'Kelas SIO',t:'sel',o:['Kelas I','Kelas II','Kelas III']},
    {k:'exp',l:'SIO Berlaku s/d',t:'date'},{k:'shift',l:'Shift',t:'sel',o:['Shift 1','Shift 2','Shift 3','Non-shift']},
    {k:'status',l:'Status',t:'sel',o:['Aktif','Cuti','Nonaktif']}],
    cols:[['Operator',r=>`<b>${esc(r.nama)}</b><small>${esc(r.nik)||'—'}</small>`],
      ['Unit',r=>`${esc(r.unit)||'—'}<small>${esc(r.jenis)||''}</small>`],
      ['SIO',r=>`${esc(r.sio)||'—'}<small>${esc(r.kelas)||''}</small>`],
      ['Masa Berlaku',r=>{const s=sio(r.exp);return `${fmt(r.exp)}<small><span class="bd ${s.c}">${s.t}</span></small>`}],
      ['Shift',r=>esc(r.shift)||'—'],
      ['Status',r=>`<span class="bd ${r.status==='Aktif'?'green':r.status==='Cuti'?'amber':'mute'}">${esc(r.status)||'—'}</span>`]]},
  zona:{title:'PIC Zona Rak',one:'Zona',
    fields:[
    {k:'zona',l:'Kode Zona / Blok',req:1},{k:'rak',l:'Area / Rak'},
    {k:'karu',l:'Karu',t:'person'},{k:'pic',l:'PIC Zona',t:'person'},
    {k:'ket',l:'Jobdesk / Keterangan',t:'area'}],
    cols:[['Zona',r=>`<span class="zn">${esc(r.zona)}</span>`],
      ['Area / Rak',r=>esc(r.rak)||'—'],['Karu',r=>esc(r.karu)||'—'],
      ['PIC',r=>`<b>${esc(r.pic)||'—'}</b>`],['Jobdesk',r=>esc(r.ket)||'—']]},
  info:{title:'Info Lain',one:'Catatan',
    fields:[
    {k:'judul',l:'Judul',req:1,w:1},{k:'kat',l:'Kategori',t:'sel',o:['Kontak Penting','Jadwal','SOP / Dokumen','Peralatan','Lainnya']},
    {k:'link',l:'Tautan (opsional)',t:'url'},{k:'isi',l:'Isi / Keterangan',t:'area'}],
    cols:[['Judul',r=>`<b>${esc(r.judul)}</b>`],['Kategori',r=>`<span class="bd mute">${esc(r.kat)||'—'}</span>`],
      ['Keterangan',r=>esc(r.isi)||'—'],['Tautan',r=>r.link?`<a href="${esc(r.link)}" target="_blank" rel="noopener" style="color:var(--ind)">Buka</a>`:'—']]},
  dok:{title:'Dokumen',one:'Dokumen',fields:[{k:'judul',l:'Judul',req:1,w:1},{k:'kat',l:'Kategori',t:'sel',o:['Struktur Organisasi','Jobdesk','SOP','Lainnya']},{k:'tanggal',l:'Tanggal Berlaku',t:'date'},{k:'ket',l:'Keterangan',t:'area'}]}
};
const TABS=[['ring','Ringkasan'],['org','Struktur Organisasi'],['fork','Operator Forklift'],['zona','PIC Zona Rak'],['dok','Dokumen'],['info','Info Lain']];
const S={tab:'ring',q:{}};

/* ===== Render ===== */
function render(){
  $('#tabs').innerHTML=TABS.map(([k,l])=>`<button class="tab ${S.tab===k?'on':''}" data-t="${k}">${l}${D[k]?`<small>${D[k].length}</small>`:''}</button>`).join('');
  $('#view').innerHTML=S.loading?'<div class="card empty"><p>Memuat data…</p></div>':S.tab==='ring'?ringkasan():S.tab==='org'?orgView():S.tab==='dok'?dokView():tableView(S.tab);
}
function barHtml(k,search){
  const c=CFG[k];
  return `<div class="bar"><h3>${c.title}<em>${D[k].length} data</em></h3><div class="tools">${search?`<input class="search" id="q" placeholder="Cari…" value="${esc(S.q[k]||'')}">`:''}<button class="btn pri adm" data-a="add" data-k="${k}">${svg(IC.plus)}Tambah ${c.one}</button></div></div>`;
}
function empty(k){
  return `<div class="card empty">${svg(IC.users)}<p>Belum ada data ${CFG[k].title.toLowerCase()}.</p><button class="btn pri adm" data-a="add" data-k="${k}">${svg(IC.plus)}Tambah ${CFG[k].one}</button></div>`;
}
const acts=(k,id)=>`<button data-a="edit" data-k="${k}" data-id="${id}" aria-label="Ubah" title="Ubah">${svg(IC.edit)}</button><button class="d" data-a="del" data-k="${k}" data-id="${id}" aria-label="Hapus" title="Hapus">${svg(IC.del)}</button>`;

function rows(k){
  const c=CFG[k],q=(S.q[k]||'').toLowerCase();
  const list=D[k].filter(r=>!q||JSON.stringify(r).toLowerCase().includes(q));
  if(!list.length) return `<div class="card empty"><p>Tidak ada data yang cocok.</p></div>`;
  return `<div class="card tw"><table><thead><tr>${c.cols.map(x=>`<th>${x[0]}</th>`).join('')}<th class="ac"></th></tr></thead><tbody>${
    list.map(r=>`<tr>${c.cols.map(x=>`<td>${x[1](r)}</td>`).join('')}<td class="act">${acts(k,r.id)}</td></tr>`).join('')}</tbody></table></div>`;
}
function tableView(k){
  return barHtml(k,D[k].length>0)+(D[k].length?`<div id="tbl">${rows(k)}</div>`:empty(k));
}
function orgView(){
  const kids={};D.org.forEach(o=>{const p=D.org.some(x=>x.id===o.atasan)?o.atasan:'';(kids[p]=kids[p]||[]).push(o);});
  const node=(o,lv)=>`<li class="lv${lv?1:0}"><div class="card node"><div class="av">${esc(ini(o.nama))}</div><div class="nm"><b>${esc(o.nama)}</b><span>${esc(o.jabatan)}</span>${o.hp?`<small>${esc(o.hp)}</small>`:''}</div><div class="act">${acts('org',o.id)}</div></div>${kids[o.id]?`<ul>${kids[o.id].map(c=>node(c,lv+1)).join('')}</ul>`:''}</li>`;
  return barHtml('org',false)+(D.org.length?`<ul class="tree">${(kids['']||[]).map(o=>node(o,0)).join('')}</ul>`:empty('org'));
}
function ringkasan(){
  const aktif=D.fork.filter(o=>o.status!=='Nonaktif');
  const warn=aktif.map(o=>({o,s:sio(o.exp)})).filter(x=>x.s.n!==null&&x.s.n<=90).sort((a,b)=>a.s.n-b.s.n);
  const nopic=D.zona.filter(z=>!z.pic);
  const kpi=(n,l,t,c)=>`<div class="card kpi" data-t="${t}" style="--c:${c}"><b>${n}</b><span>${l}</span></div>`;
  return `<div class="kpis">${kpi(D.org.length,'Personel','org','var(--brand)')}${kpi(D.fork.filter(o=>o.status==='Aktif').length,'Operator aktif','fork','var(--ind)')}${kpi(warn.length,'SIO perlu perhatian','fork',warn.length?'var(--red)':'var(--green)')}${kpi(D.zona.length,'Zona rak','zona','var(--amber)')}</div>
  <div class="grid2">
    <div class="card panel"><h4>Masa Berlaku SIO ≤ 90 Hari</h4>${warn.length?warn.map(({o,s})=>`<div class="li"><div>${esc(o.nama)}<small>${esc(o.sio)||'No. SIO belum diisi'} · ${fmt(o.exp)}</small></div><span class="bd ${s.c}">${s.t}</span></div>`).join(''):'<div class="none">Tidak ada SIO yang mendekati masa berakhir.</div>'}</div>
    <div class="card panel"><h4>Zona Belum Punya PIC</h4>${nopic.length?nopic.map(z=>`<div class="li"><div>Zona ${esc(z.zona)}<small>${esc(z.rak)||'—'}</small></div><button class="btn adm" data-a="edit" data-k="zona" data-id="${z.id}">Isi PIC</button></div>`).join(''):`<div class="none">${D.zona.length?'Semua zona sudah memiliki PIC.':'Belum ada data zona.'}</div>`}</div>
  </div>
  <p class="note">Data tersimpan di server (Supabase) dan dapat dilihat semua pengguna. Hanya admin yang dapat menambah, mengubah, dan menghapus.</p>`;
}

/* ===== Form ===== */
function openForm(k,id){
  const c=CFG[k],r=id?D[k].find(x=>x.id===id):{};
  const inp=f=>{
    const v=esc(r[f.k]||'');
    if(f.t==='sel') return `<select name="${f.k}"><option value="">— pilih —</option>${f.o.map(o=>`<option ${r[f.k]===o?'selected':''}>${o}</option>`).join('')}</select>`;
    if(f.t==='ref') return `<select name="${f.k}"><option value="">— (puncak struktur) —</option>${D.org.filter(o=>o.id!==id).map(o=>`<option value="${o.id}" ${r[f.k]===o.id?'selected':''}>${esc(o.nama)} — ${esc(o.jabatan)}</option>`).join('')}</select>`;
    if(f.t==='area') return `<textarea name="${f.k}">${v}</textarea>`;
    if(f.t==='person') return `<input name="${f.k}" value="${v}" list="pl" autocomplete="off">`;
    return `<input name="${f.k}" type="${f.t||'text'}" value="${v}" ${f.req?'required':''}>`;
  };
  $('#frm').innerHTML=`<div class="mh"><div class="eyebrow">${c.title}</div><h3>${id?'Ubah':'Tambah'} ${c.one}</h3></div>
  <div class="mb">${c.fields.map(f=>`<div class="fld ${f.w||f.t==='area'||f.t==='ref'||f.t==='url'?'w':''}"><label>${f.l}${f.req?' *':''}</label>${inp(f)}</div>`).join('')}</div>
  <datalist id="pl">${people().map(p=>`<option value="${esc(p)}">`).join('')}</datalist>
  <div class="mf"><button class="btn" type="button" data-a="close">Batal</button><button class="btn pri" type="submit">Simpan</button></div>`;
  $('#frm').onsubmit=async e=>{
    e.preventDefault();
    const fd=new FormData($('#frm')),obj={};
    c.fields.forEach(f=>obj[f.k]=String(fd.get(f.k)||'').trim());
    if(await saveRow(k,id,obj)){$('#dlg').close();render();toast('Data tersimpan');}
  };
  $('#dlg').showModal();
}
async function del(k,id){
  const r=D[k].find(x=>x.id===id),nm=r.nama||r.zona||r.judul;
  if(!confirm(`Hapus "${nm}"?`))return;
  if(k==='dok'){
    const f=pages(r).map(u=>u.split('/').pop());
    if(f.length){const {error}=await sb.storage.from(BUCKET).remove(f);if(error)console.warn(error.message);}
  }
  const {error}=await sb.from(T[k]).delete().eq('id',id);
  if(error)return toast('Gagal menghapus: '+error.message);
  await loadAll();render();toast('Data dihapus');
}

/* ===== Ekspor / Impor ===== */
function exportJson(){
  const a=document.createElement('a');
  a.href=URL.createObjectURL(new Blob([JSON.stringify(D,null,2)],{type:'application/json'}));
  a.download='profil-departemen-sbj-'+new Date().toISOString().slice(0,10)+'.json';
  a.click();setTimeout(()=>URL.revokeObjectURL(a.href),1000);
}

/* ===== Event ===== */
document.addEventListener('click',e=>{
  const t=e.target.closest('[data-t]');
  if(t){S.tab=t.dataset.t;render();scrollTo({top:0});return;}
  const b=e.target.closest('[data-a]');if(!b)return;
  const a=b.dataset.a,k=b.dataset.k,id=b.dataset.id;
  if(a==='add')k==='dok'?openUpload():openForm(k);
  else if(a==='edit')openForm(k,id);
  else if(a==='del')del(k,id);
  else if(a==='close')$('#dlg').close();
  else if(a==='export')exportJson();
  else if(a==='read')openReader(id);
  else if(a==='zin')zoom(20);
  else if(a==='zout')zoom(-20);
  else if(a==='print')print();
});
document.addEventListener('input',e=>{
  if(e.target.id==='q'){S.q[S.tab]=e.target.value;$('#tbl').innerHTML=rows(S.tab);}
});

/* ===== Tema & toast ===== */
function setTheme(t,sv){
  document.documentElement.dataset.theme=t;
  $('#themeBtn').firstElementChild.innerHTML=t==='dark'?IC.sun:IC.moon;
  if(sv)try{localStorage.setItem('stockopname.theme',t);}catch(e){}
}
$('#themeBtn').addEventListener('click',()=>setTheme(document.documentElement.dataset.theme==='dark'?'light':'dark',true));
setTheme(document.documentElement.dataset.theme,false);
let tt;function toast(m){const el=$('#toast');el.textContent=m;el.classList.add('on');clearTimeout(tt);tt=setTimeout(()=>el.classList.remove('on'),2000);}

async function init(){
  S.loading=true;render();
  if(!sb){toast('Supabase tidak dapat dimuat, cek koneksi');S.loading=false;render();return;}
  sb.auth.getSession().then(({data})=>{ses=data.session;authUI();});
  sb.auth.onAuthStateChange((_e,x)=>{ses=x;authUI();});
  await loadAll();S.loading=false;render();
}
authUI();init();
if('serviceWorker' in navigator)window.addEventListener('load',()=>navigator.serviceWorker.register('sw.js').catch(()=>{}));
</script>
