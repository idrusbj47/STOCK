<!DOCTYPE html>
<html lang="id" data-theme="light">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
<title>Profil Departemen — SBJ Apps</title>
<meta name="description" content="Profil Departemen Gudang Barang Jadi: dokumen struktur organisasi, operator forklift, PIC zona rak" />
<meta name="theme-color" content="#f4f7fb" />
<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
<script>try{var t=localStorage.getItem('stockopname.theme');if(t)document.documentElement.dataset.theme=t;}catch(e){}</script>
<link rel="manifest" href="manifest.json" />
<link rel="icon" href="icons/icon.png" />
<link rel="apple-touch-icon" href="icons/icon.png" />
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Barlow+Condensed:wght@500;600;700;800&family=Inter:wght@400;500;600;700&family=JetBrains+Mono:wght@400;500;600&display=swap" rel="stylesheet">
<style>
:root{
  --bg:#f4f7fb; --surface:#fff; --s2:#f8fafc; --border:#e2e8f0; --text:#0f172a; --muted:#64748b;
  --brand:#2563eb; --ind:#4f46e5; --green:#15803d; --red:#dc2626; --gbg:rgba(22,163,74,.12);
  --shadow:0 20px 50px rgba(15,23,42,.08),0 3px 10px rgba(15,23,42,.03);
  --fd:'Barlow Condensed',sans-serif; --fb:'Inter',sans-serif; --fm:'JetBrains Mono',monospace; color-scheme:light;
}
html[data-theme="dark"]{
  --bg:#0b1220; --surface:#111827; --s2:#162033; --border:#253248; --text:#f8fafc; --muted:#94a3b8;
  --brand:#60a5fa; --ind:#818cf8; --green:#34d399; --red:#f87171; --gbg:rgba(52,211,153,.14);
  --shadow:0 24px 60px rgba(0,0,0,.28),0 2px 8px rgba(0,0,0,.14); color-scheme:dark;
}
*{box-sizing:border-box}
html{min-height:100%}
body{margin:0;font-family:var(--fb);color:var(--text);background:var(--bg);-webkit-font-smoothing:antialiased;
  background-image:linear-gradient(var(--border) 1px,transparent 1px),linear-gradient(90deg,var(--border) 1px,transparent 1px);
  background-size:44px 44px;background-attachment:fixed;padding-bottom:env(safe-area-inset-bottom)}
body::before{content:"";position:fixed;inset:0;background:radial-gradient(ellipse at top,transparent 0,var(--bg) 78%);opacity:.93;z-index:-1}
button,input,select,textarea{font:inherit;color:inherit}
.wrap{max-width:1080px;margin:0 auto;padding:0 18px}
.adm{display:none!important}body.is-admin .adm{display:inline-flex!important}

.top{position:sticky;top:0;z-index:50;background:color-mix(in srgb,var(--bg) 86%,transparent);backdrop-filter:blur(12px);-webkit-backdrop-filter:blur(12px);border-bottom:1px solid var(--border);padding-top:env(safe-area-inset-top)}
.top .wrap{display:flex;align-items:center;gap:10px;height:64px}
.ib{width:40px;height:40px;border-radius:12px;border:1px solid var(--border);background:var(--surface);display:inline-flex;align-items:center;justify-content:center;cursor:pointer;color:var(--text);flex:none;text-decoration:none;font-size:20px;line-height:1}
.ib:hover{border-color:var(--ind);color:var(--ind)}
.ib.sm{width:36px;height:36px;border-radius:10px}
.ib.dng:hover{color:var(--red);border-color:var(--red)}
svg.i{width:19px;height:19px;fill:none;stroke:currentColor;stroke-width:2;stroke-linecap:round;stroke-linejoin:round}
.brand{flex:1;min-width:0;line-height:1}
.eyebrow{font:500 10px var(--fm);letter-spacing:.2em;text-transform:uppercase;color:var(--muted)}
.brand h1{margin:5px 0 0;font:800 25px/1 var(--fd);letter-spacing:.01em;text-transform:uppercase}
.brand h1 span{color:var(--ind)}
.chip{font:600 10.5px var(--fm);padding:6px 11px;border-radius:99px;background:var(--s2);border:1px solid var(--border);color:var(--muted);letter-spacing:.08em}
body.is-admin .chip{background:var(--gbg);color:var(--green);border-color:transparent}

.hero{padding:30px 0 6px}
.hero h2{margin:8px 0 0;font:800 42px/1 var(--fd);text-transform:uppercase}
.hero h2 span{color:var(--ind)}
.hero p{margin:10px 0 0;color:var(--muted);font-size:14px;max-width:560px;line-height:1.55}

.tabs{position:sticky;top:calc(64px + env(safe-area-inset-top));z-index:40;margin-top:18px;background:color-mix(in srgb,var(--bg) 90%,transparent);backdrop-filter:blur(10px);-webkit-backdrop-filter:blur(10px);border-bottom:1px solid var(--border)}
.tabs .wrap{display:flex;gap:4px;overflow-x:auto;scrollbar-width:none}
.tabs .wrap::-webkit-scrollbar{display:none}
.tab{flex:none;border:0;background:none;cursor:pointer;padding:15px 16px 13px;font:700 17px var(--fd);letter-spacing:.03em;text-transform:uppercase;color:var(--muted);border-bottom:3px solid transparent;white-space:nowrap}
.tab:hover{color:var(--text)}
.tab.on{color:var(--ind);border-color:var(--ind)}
.tab.add{color:var(--ind)}

main{padding:24px 0 70px}
.card{background:var(--surface);border:1px solid var(--border);border-radius:18px;box-shadow:var(--shadow)}
.bar{display:flex;gap:10px;flex-wrap:wrap;align-items:center;justify-content:space-between;margin-bottom:16px}
.bar h3{margin:0;font:800 26px var(--fd);text-transform:uppercase}
.tools{display:flex;gap:8px;flex-wrap:wrap;align-items:center}
.btn{display:inline-flex;align-items:center;gap:8px;height:40px;padding:0 15px;border-radius:12px;border:1px solid var(--border);background:var(--surface);cursor:pointer;font-weight:600;font-size:13px;white-space:nowrap}
.btn:hover{border-color:var(--ind)}
.btn.pri{background:var(--ind);border-color:var(--ind);color:#fff}
.btn.pri:hover{filter:brightness(1.08)}
.btn svg.i{width:17px;height:17px}

.docs{display:flex;gap:8px;flex-wrap:wrap;margin-bottom:14px}
.dchip{border:1px solid var(--border);background:var(--surface);border-radius:99px;padding:8px 14px;cursor:pointer;font-size:13px;font-weight:600}
.dchip.on{background:var(--ind);border-color:var(--ind);color:#fff}
.vh{display:flex;justify-content:space-between;gap:12px;align-items:flex-start;flex-wrap:wrap;padding:18px 20px;border-bottom:1px solid var(--border)}
.vh b{display:block;font:800 22px var(--fd);text-transform:uppercase}
.vh small{display:block;margin-top:5px;color:var(--muted);font:500 11.5px/1.5 var(--fm)}
.vh p{margin:8px 0 0;font-size:13.5px;color:var(--muted);line-height:1.5}
.pgs{background:var(--s2);padding:14px;display:flex;flex-direction:column;gap:12px;border-radius:0 0 18px 18px}
.pgs img{display:block;width:100%;max-width:920px;margin:0 auto;height:auto;min-height:220px;background:#fff;box-shadow:var(--shadow)}
.empty{text-align:center;padding:56px 20px;color:var(--muted)}
.empty svg.i{width:46px;height:46px;stroke:var(--ind);stroke-width:1.5;opacity:.7;margin-bottom:10px}
.empty p{margin:0 0 16px;font-size:14px}
.qk{gap:8px;flex-wrap:wrap;justify-content:center}

dialog{border:0;padding:0;border-radius:20px;background:var(--surface);color:var(--text);width:min(520px,calc(100vw - 28px));box-shadow:0 30px 80px rgba(0,0,0,.35)}
dialog::backdrop{background:rgba(8,13,25,.55);backdrop-filter:blur(3px)}
.mh{padding:20px 22px 4px}
.mh h3{margin:0;font:800 26px var(--fd);text-transform:uppercase}
.mb{padding:10px 22px;display:grid;grid-template-columns:1fr 1fr;gap:12px;max-height:62vh;overflow:auto}
.fld{display:flex;flex-direction:column;gap:6px}
.fld.w{grid-column:1/-1}
.fld label{font:600 10.5px var(--fm);letter-spacing:.08em;text-transform:uppercase;color:var(--muted)}
.fld input,.fld textarea{width:100%;min-height:42px;padding:9px 12px;border-radius:11px;border:1px solid var(--border);background:var(--s2);outline:none;font-size:16px}
.fld textarea{min-height:84px;resize:vertical}
.fld input:focus,.fld textarea:focus{border-color:var(--ind);box-shadow:0 0 0 3px color-mix(in srgb,var(--ind) 18%,transparent)}
.pw{position:relative}.pw input{padding-right:46px}
.pw button{position:absolute;right:4px;top:3px;width:36px;height:36px;border:0;background:none;color:var(--muted);cursor:pointer}
.mf{display:flex;justify-content:flex-end;gap:8px;padding:14px 22px 20px}
.prog{font:500 12px/1.6 var(--fm);color:var(--muted)}
dialog.rd{width:100vw;max-width:100vw;height:100dvh;max-height:100dvh;margin:0;border-radius:0}
dialog.rd form{display:flex;flex-direction:column;height:100%}
.rh{display:flex;justify-content:space-between;align-items:center;gap:12px;padding:12px 16px;padding-top:calc(12px + env(safe-area-inset-top));border-bottom:1px solid var(--border)}
.rh b{font:800 20px var(--fd);text-transform:uppercase}
.rb{flex:1;overflow:auto;background:var(--s2);padding:12px;display:flex;flex-direction:column;align-items:flex-start;gap:12px}
.rb img{display:block;width:calc(min(100%,1000px)*var(--z,1));max-width:none;height:auto;margin:0 auto;background:#fff;box-shadow:var(--shadow);flex:none}
.toast{position:fixed;left:50%;bottom:calc(24px + env(safe-area-inset-bottom));transform:translate(-50%,30px);background:var(--text);color:var(--bg);padding:11px 18px;border-radius:12px;font-size:13px;font-weight:600;opacity:0;pointer-events:none;transition:.25s;z-index:99}
.toast.on{opacity:1;transform:translate(-50%,0)}
@media(max-width:760px){.hero h2{font-size:34px}.mb{grid-template-columns:1fr}.pgs{padding:8px}}
</style>
</head>
<body>

<header class="top"><div class="wrap">
  <a class="ib" href="index.html" aria-label="Kembali ke menu" title="Kembali ke menu"><svg class="i" viewBox="0 0 24 24"><path d="M15 6l-6 6 6 6"/></svg></a>
  <div class="brand"><div class="eyebrow">SBJ Apps · Gudang Barang Jadi</div><h1>Profil <span>Departemen</span></h1></div>
  <span class="chip" id="chip">TAMU</span>
  <button class="ib" id="loginBtn" aria-label="Login admin" title="Login admin"><svg class="i" viewBox="0 0 24 24"></svg></button>
  <button class="ib" id="themeBtn" aria-label="Ganti tema" title="Ganti tema"><svg class="i" viewBox="0 0 24 24"></svg></button>
</div></header>

<div class="wrap"><section class="hero">
  <div class="eyebrow">Pusat Data Departemen</div>
  <h2>Gudang <span>Barang Jadi</span></h2>
  <p>Dokumen resmi departemen: struktur organisasi, operator forklift, PIC zona rak, dan lainnya.</p>
</section></div>

<nav class="tabs"><div class="wrap" id="tabs"></div></nav>
<main><div class="wrap" id="view"></div></main>

<dialog id="dlg"><form method="dialog" id="frm"></form></dialog>
<div class="toast" id="toast"></div>

<script>
const $=s=>document.querySelector(s);
const esc=s=>String(s==null?'':s).replace(/[&<>"]/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[c]));
const fmt=d=>d?new Date(d+'T00:00:00').toLocaleDateString('id-ID',{day:'2-digit',month:'long',year:'numeric'}):'';
const IC={
  lock:'<rect x="5" y="11" width="14" height="9" rx="2"/><path d="M8 11V8a4 4 0 018 0v3"/>',
  unlock:'<rect x="5" y="11" width="14" height="9" rx="2"/><path d="M8 11V8a4 4 0 017.6-1.7"/>',
  moon:'<path d="M21 12.79A9 9 0 1 1 11.21 3 7 7 0 0 0 21 12.79z"/>',
  sun:'<circle cx="12" cy="12" r="4"/><path d="M12 2v2M12 20v2M4.9 4.9l1.4 1.4M17.7 17.7l1.4 1.4M2 12h2M20 12h2M4.9 19.1l1.4-1.4M17.7 6.3l1.4-1.4"/>',
  up:'<path d="M12 15V4M7 9l5-5 5 5M5 20h14"/>',plus:'<path d="M12 5v14M5 12h14"/>',
  edit:'<path d="M4 20h4L19 9l-4-4L4 16v4zM13.5 6.5l4 4"/>',
  del:'<path d="M4 7h16M10 11v6M14 11v6M6 7l1 13h10l1-13M9 7V4h6v3"/>',
  l:'<path d="M15 6l-6 6 6 6"/>',r:'<path d="M9 6l6 6-6 6"/>',
  full:'<path d="M4 9V4h5M20 9V4h-5M4 15v5h5M20 15v5h-5"/>',
  eye:'<path d="M2 12s3.6-7 10-7 10 7 10 7-3.6 7-10 7S2 12 2 12z"/><circle cx="12" cy="12" r="3"/>',
  doc:'<path d="M7 3h7l5 5v13H7zM14 3v5h5M10 13h6M10 17h6"/>'
};
const svg=p=>`<svg class="i" viewBox="0 0 24 24">${p}</svg>`;
let tt;function toast(m){const el=$('#toast');el.textContent=m;el.classList.add('on');clearTimeout(tt);tt=setTimeout(()=>el.classList.remove('on'),2200);}

/* ===== Supabase (sama dengan Temuan 5R5S) ===== */
const SB_URL='https://bpqiejowxcxyeewhoncr.supabase.co',SB_KEY='sb_publishable_3tCR_a01HgzEpH-5uypqGg_s8WvXsa9',BUCKET='profil-dokumen';
const sb=window.supabase?window.supabase.createClient(SB_URL,SB_KEY):null;
let D={tab:[],dok:[]},ses=null,S={tab:null,doc:null,loading:true};
const pages=d=>(d.halaman_url||'').split(',').filter(Boolean);
const fileOf=u=>u.split('/').pop();

async function load(){
  const [a,b]=await Promise.all([
    sb.from('profil_tab').select('*').order('urutan').order('created_at'),
    sb.from('profil_dokumen').select('*').order('created_at',{ascending:false})]);
  if(a.error||b.error){toast('Gagal memuat: '+(a.error||b.error).message);return;}
  D.tab=a.data;D.dok=b.data;
  if(!D.tab.some(t=>t.id===S.tab)){
    let s=null;try{s=localStorage.getItem('sbj.profil.tab');}catch(e){}
    S.tab=D.tab.some(t=>t.id===s)?s:(D.tab[0]||{}).id||null;
  }
}

/* ===== Auth admin (Supabase Auth) ===== */
function authUI(){
  document.body.classList.toggle('is-admin',!!ses);
  $('#chip').textContent=ses?'ADMIN':'TAMU';
  $('#loginBtn').firstElementChild.innerHTML=ses?IC.unlock:IC.lock;
}
function openLogin(){
  $('#frm').innerHTML=`<div class="mh"><div class="eyebrow">Akses Admin</div><h3>Login Admin</h3></div><div class="mb"><div class="fld w"><label>Email</label><input name="email" type="email" autocomplete="username" required></div><div class="fld w"><label>Password</label><div class="pw"><input name="pw" id="pw" type="password" autocomplete="current-password" required><button type="button" data-a="eye" aria-label="Lihat password">${svg(IC.eye)}</button></div></div><div class="fld w prog" id="msg"></div></div><div class="mf"><button class="btn" type="button" data-a="close">Batal</button><button class="btn pri" type="submit" id="okBtn">Masuk</button></div>`;
  $('#frm').onsubmit=async e=>{
    e.preventDefault();const f=new FormData($('#frm')),b=$('#okBtn');b.disabled=true;$('#msg').textContent='Memproses…';
    const {error}=await sb.auth.signInWithPassword({email:String(f.get('email')).trim(),password:f.get('pw')});
    if(error){$('#msg').textContent='Gagal login: '+error.message;b.disabled=false;return;}
    $('#dlg').close();toast('Berhasil masuk');
  };
  $('#dlg').showModal();
}
$('#loginBtn').onclick=async()=>{
  if(!sb)return toast('Supabase belum termuat, cek koneksi');
  if(!ses)return openLogin();
  if(confirm('Keluar dari akun admin?'))await sb.auth.signOut();
};

/* ===== Render ===== */
function render(){
  $('#tabs').innerHTML=D.tab.map(t=>`<button class="tab ${S.tab===t.id?'on':''}" data-t="${t.id}">${esc(t.nama)}</button>`).join('')+`<button class="tab add adm" data-a="tabadd">+ Tab</button>`;
  $('#view').innerHTML=S.loading?`<div class="card empty"><p>Memuat data…</p></div>`:!D.tab.length?noTabs():panel();
}
function noTabs(){
  return `<div class="card empty">${svg(IC.doc)}<p>Belum ada konten. Admin dapat membuat tab lalu mengupload dokumen.</p>
  <div class="adm qk">${['Struktur Organisasi','Operator Forklift','PIC Zona Rak'].map(n=>`<button class="btn" data-a="tabquick" data-n="${n}">${svg(IC.plus)}${n}</button>`).join('')}<button class="btn pri" data-a="tabadd">${svg(IC.plus)}Tab Lain</button></div></div>`;
}
function panel(){
  const t=D.tab.find(x=>x.id===S.tab),docs=D.dok.filter(d=>d.tab_id===t.id);
  if(!docs.some(d=>d.id===S.doc))S.doc=(docs[0]||{}).id;
  const d=docs.find(x=>x.id===S.doc),i=D.tab.indexOf(t);
  const bar=`<div class="bar"><h3>${esc(t.nama)}</h3><div class="tools">
    <button class="ib sm adm" data-a="tabl" aria-label="Geser kiri" title="Geser tab ke kiri" ${i===0?'disabled':''}>${svg(IC.l)}</button>
    <button class="ib sm adm" data-a="tabr" aria-label="Geser kanan" title="Geser tab ke kanan" ${i===D.tab.length-1?'disabled':''}>${svg(IC.r)}</button>
    <button class="ib sm adm" data-a="tabedit" aria-label="Ubah nama tab" title="Ubah nama tab">${svg(IC.edit)}</button>
    <button class="ib sm adm dng" data-a="tabdel" aria-label="Hapus tab" title="Hapus tab">${svg(IC.del)}</button>
    <button class="btn pri adm" data-a="upload">${svg(IC.up)}Upload Dokumen</button></div></div>`;
  if(!d)return bar+`<div class="card empty">${svg(IC.doc)}<p>Belum ada dokumen di tab ini.</p></div>`;
  const p=pages(d);
  return bar+(docs.length>1?`<div class="docs">${docs.map(x=>`<button class="dchip ${x.id===d.id?'on':''}" data-a="pick" data-id="${x.id}">${esc(x.judul)}</button>`).join('')}</div>`:'')+
  `<div class="card"><div class="vh"><div><b>${esc(d.judul)}</b><small>${d.tanggal?'Berlaku '+fmt(d.tanggal)+' · ':''}${p.length} halaman</small>${d.ket?`<p>${esc(d.ket)}</p>`:''}</div>
    <div class="tools"><button class="btn" data-a="read" data-id="${d.id}">${svg(IC.full)}Layar Penuh</button>
    <button class="ib sm adm" data-a="docedit" data-id="${d.id}" aria-label="Ubah" title="Ubah info dokumen">${svg(IC.edit)}</button>
    <button class="ib sm adm dng" data-a="docdel" data-id="${d.id}" aria-label="Hapus" title="Hapus dokumen">${svg(IC.del)}</button></div></div>
    <div class="pgs">${p.map((u,n)=>`<img src="${esc(u)}" loading="lazy" alt="Halaman ${n+1}">`).join('')}</div></div>`;
}

/* ===== Tab (admin) ===== */
function tabForm(id,preset){
  const t=id?D.tab.find(x=>x.id===id):null;
  $('#frm').innerHTML=`<div class="mh"><div class="eyebrow">Menu Tab</div><h3>${t?'Ubah Nama Tab':'Tambah Tab'}</h3></div><div class="mb"><div class="fld w"><label>Nama Tab *</label><input name="nama" value="${esc(t?t.nama:preset||'')}" maxlength="40" required></div></div><div class="mf"><button class="btn" type="button" data-a="close">Batal</button><button class="btn pri" type="submit">Simpan</button></div>`;
  $('#frm').onsubmit=async e=>{
    e.preventDefault();const nama=String(new FormData($('#frm')).get('nama')).trim();
    const q=t?sb.from('profil_tab').update({nama}).eq('id',t.id):sb.from('profil_tab').insert({nama,urutan:D.tab.length}).select().single();
    const {data,error}=await q;
    if(error)return toast('Gagal menyimpan: '+error.message);
    if(!t&&data)setTab(data.id);
    await load();$('#dlg').close();render();toast('Tab tersimpan');
  };
  $('#dlg').showModal();
}
function setTab(id){S.tab=id;S.doc=null;try{localStorage.setItem('sbj.profil.tab',id);}catch(e){}}
async function tabMove(dir){
  const a=[...D.tab],i=a.findIndex(x=>x.id===S.tab),j=i+dir;if(j<0||j>=a.length)return;
  [a[i],a[j]]=[a[j],a[i]];
  await Promise.all(a.map((x,n)=>x.urutan===n?null:sb.from('profil_tab').update({urutan:n}).eq('id',x.id)));
  await load();render();
}
async function tabDel(){
  const t=D.tab.find(x=>x.id===S.tab),docs=D.dok.filter(d=>d.tab_id===t.id);
  if(!confirm(`Hapus tab "${t.nama}" beserta ${docs.length} dokumen di dalamnya? Tidak bisa dibatalkan.`))return;
  const f=docs.flatMap(d=>pages(d).map(fileOf));
  if(f.length){const {error}=await sb.storage.from(BUCKET).remove(f);if(error)console.warn(error.message);}
  const {error}=await sb.from('profil_tab').delete().eq('id',t.id);
  if(error)return toast('Gagal menghapus: '+error.message);
  S.tab=null;await load();render();toast('Tab dihapus');
}

/* ===== Dokumen ===== */
function docForm(id){
  const d=D.dok.find(x=>x.id===id);
  $('#frm').innerHTML=`<div class="mh"><div class="eyebrow">Dokumen</div><h3>Ubah Info Dokumen</h3></div><div class="mb"><div class="fld w"><label>Judul *</label><input name="judul" value="${esc(d.judul)}" required></div><div class="fld w"><label>Tanggal Berlaku</label><input name="tanggal" type="date" value="${esc(d.tanggal||'')}"></div><div class="fld w"><label>Keterangan</label><textarea name="ket">${esc(d.ket||'')}</textarea></div></div><div class="mf"><button class="btn" type="button" data-a="close">Batal</button><button class="btn pri" type="submit">Simpan</button></div>`;
  $('#frm').onsubmit=async e=>{
    e.preventDefault();const f=new FormData($('#frm'));
    const {error}=await sb.from('profil_dokumen').update({judul:String(f.get('judul')).trim(),tanggal:f.get('tanggal')||null,ket:String(f.get('ket')).trim()||null}).eq('id',id);
    if(error)return toast('Gagal menyimpan: '+error.message);
    await load();$('#dlg').close();render();toast('Tersimpan');
  };
  $('#dlg').showModal();
}
async function docDel(id){
  const d=D.dok.find(x=>x.id===id);
  if(!confirm(`Hapus dokumen "${d.judul}"?`))return;
  const f=pages(d).map(fileOf);
  if(f.length){const {error}=await sb.storage.from(BUCKET).remove(f);if(error)console.warn(error.message);}
  const {error}=await sb.from('profil_dokumen').delete().eq('id',id);
  if(error)return toast('Gagal menghapus: '+error.message);
  S.doc=null;await load();render();toast('Dokumen dihapus');
}

/* Upload PDF -> WebP per halaman (maks. 500 KB) */
const PDFJS='https://cdnjs.cloudflare.com/ajax/libs/pdf.js/3.11.174/',MAXB=500*1024,MAXW=1700;
function loadPdfjs(){
  return window.pdfjsLib?Promise.resolve():new Promise((ok,no)=>{
    const s=document.createElement('script');s.src=PDFJS+'pdf.min.js';
    s.onload=()=>{pdfjsLib.GlobalWorkerOptions.workerSrc=PDFJS+'pdf.worker.min.js';ok();};
    s.onerror=()=>no(new Error('pdf.js gagal dimuat, cek koneksi'));document.head.appendChild(s);
  });
}
const toBlob=(c,t,q)=>new Promise(r=>c.toBlob(r,t,q));
async function encode(cv){
  const t=cv.toDataURL('image/webp').startsWith('data:image/webp')?'image/webp':'image/jpeg';
  let c=cv,b;
  for(let n=0;n<4;n++){
    for(let q=.86;q>=.5;q-=.08){b=await toBlob(c,t,q);if(b.size<=MAXB)return{b,t};}
    const x=document.createElement('canvas');x.width=Math.round(c.width*.85);x.height=Math.round(c.height*.85);
    x.getContext('2d').drawImage(c,0,0,x.width,x.height);c=x;
  }
  return{b,t};
}
function openUpload(){
  $('#frm').innerHTML=`<div class="mh"><div class="eyebrow">${esc(D.tab.find(x=>x.id===S.tab).nama)}</div><h3>Upload Dokumen</h3></div><div class="mb">
  <div class="fld w"><label>File PDF *</label><input name="pdf" id="pdf" type="file" accept="application/pdf" required></div>
  <div class="fld w"><label>Judul *</label><input name="judul" id="jdl" required></div>
  <div class="fld w"><label>Tanggal Berlaku</label><input name="tanggal" type="date"></div>
  <div class="fld w"><label>Keterangan</label><textarea name="ket"></textarea></div>
  <div class="fld w prog" id="prog">Tiap halaman diubah ke WebP (maks. 500 KB) lalu disimpan per halaman.</div></div>
  <div class="mf"><button class="btn" type="button" data-a="close">Batal</button><button class="btn pri" type="submit" id="upBtn">Upload</button></div>`;
  $('#pdf').onchange=e=>{const f=e.target.files[0];if(f&&!$('#jdl').value)$('#jdl').value=f.name.replace(/\.pdf$/i,'');};
  $('#frm').onsubmit=e=>{e.preventDefault();doUpload(new FormData($('#frm')));};
  $('#dlg').showModal();
}
async function doUpload(fd){
  const prog=$('#prog'),btn=$('#upBtn'),done=[],urls=[];btn.disabled=true;
  try{
    await loadPdfjs();
    const pdf=await pdfjsLib.getDocument({data:await fd.get('pdf').arrayBuffer()}).promise;
    const stamp=Date.now()+'_'+Math.random().toString(36).slice(2,6);
    for(let i=1;i<=pdf.numPages;i++){
      prog.textContent=`Memproses halaman ${i} dari ${pdf.numPages}…`;
      const pg=await pdf.getPage(i),v0=pg.getViewport({scale:1}),vp=pg.getViewport({scale:Math.min(3,MAXW/v0.width)});
      const cv=document.createElement('canvas');cv.width=Math.round(vp.width);cv.height=Math.round(vp.height);
      const cx=cv.getContext('2d');cx.fillStyle='#fff';cx.fillRect(0,0,cv.width,cv.height);
      await pg.render({canvasContext:cx,viewport:vp}).promise;
      const {b,t}=await encode(cv),name=`${stamp}_p${String(i).padStart(3,'0')}.${t==='image/webp'?'webp':'jpg'}`;
      const {error}=await sb.storage.from(BUCKET).upload(name,b,{contentType:t,cacheControl:'31536000'});
      if(error)throw error;
      done.push(name);urls.push(sb.storage.from(BUCKET).getPublicUrl(name).data.publicUrl);
    }
    const {data,error}=await sb.from('profil_dokumen').insert({tab_id:S.tab,judul:String(fd.get('judul')).trim(),tanggal:fd.get('tanggal')||null,ket:String(fd.get('ket')).trim()||null,halaman_url:urls.join(',')}).select().single();
    if(error)throw error;
    S.doc=data.id;await load();$('#dlg').close();render();toast(`Dokumen tersimpan (${urls.length} halaman)`);
  }catch(e){
    if(done.length)await sb.storage.from(BUCKET).remove(done);
    prog.textContent='Gagal: '+(e.message||e);btn.disabled=false;
  }
}

/* Layar penuh */
function openReader(id){
  const d=D.dok.find(x=>x.id===id),p=pages(d);
  $('#frm').innerHTML=`<div class="rh"><div><div class="eyebrow">${p.length} halaman</div><b>${esc(d.judul)}</b></div><div class="tools"><button class="ib" type="button" data-a="zout" aria-label="Perkecil">−</button><button class="ib" type="button" data-a="zin" aria-label="Perbesar">+</button>${document.fullscreenEnabled?`<button class="ib" type="button" data-a="fs" aria-label="Layar penuh perangkat" title="Layar penuh perangkat">${svg(IC.full)}</button>`:''}<button class="ib" type="button" data-a="close" aria-label="Tutup">✕</button></div></div><div class="rb" id="rb">${p.map((u,n)=>`<img src="${esc(u)}" loading="lazy" alt="Halaman ${n+1}">`).join('')}</div>`;
  $('#frm').onsubmit=null;zoom.v=100;$('#dlg').classList.add('rd');$('#dlg').showModal();
}
function zoom(n){zoom.v=Math.max(50,Math.min(250,(zoom.v||100)+n));$('#rb').style.setProperty('--z',zoom.v/100);}
$('#dlg').addEventListener('close',()=>{$('#dlg').classList.remove('rd');if(document.fullscreenElement)document.exitFullscreen();});

/* ===== Event ===== */
document.addEventListener('click',async e=>{
  const t=e.target.closest('[data-t]');
  if(t){setTab(t.dataset.t);render();return;}
  const b=e.target.closest('[data-a]');if(!b||b.disabled)return;
  const a=b.dataset.a,id=b.dataset.id;
  if(a==='close')$('#dlg').close();
  else if(a==='pick'){S.doc=id;render();}
  else if(a==='read')openReader(id);
  else if(a==='zin')zoom(20);
  else if(a==='zout')zoom(-20);
  else if(a==='fs'){document.fullscreenElement?document.exitFullscreen():$('#dlg').requestFullscreen().catch(()=>{});}
  else if(a==='eye'){const i=$('#pw');i.type=i.type==='password'?'text':'password';}
  else if(a==='tabadd')tabForm();
  else if(a==='tabquick')tabForm(null,b.dataset.n);
  else if(a==='tabedit')tabForm(S.tab);
  else if(a==='tabdel')tabDel();
  else if(a==='tabl')tabMove(-1);
  else if(a==='tabr')tabMove(1);
  else if(a==='upload')openUpload();
  else if(a==='docedit')docForm(id);
  else if(a==='docdel')docDel(id);
});

/* ===== Tema ===== */
function setTheme(t,sv){
  document.documentElement.dataset.theme=t;
  $('#themeBtn').firstElementChild.innerHTML=t==='dark'?IC.sun:IC.moon;
  if(sv)try{localStorage.setItem('stockopname.theme',t);}catch(e){}
}
$('#themeBtn').addEventListener('click',()=>setTheme(document.documentElement.dataset.theme==='dark'?'light':'dark',true));
setTheme(document.documentElement.dataset.theme,false);

async function init(){
  authUI();render();
  if(!sb){toast('Supabase tidak dapat dimuat, cek koneksi');S.loading=false;render();return;}
  sb.auth.getSession().then(({data})=>{ses=data.session;authUI();});
  sb.auth.onAuthStateChange((_e,x)=>{ses=x;authUI();});
  await load();S.loading=false;render();
}
init();
if('serviceWorker' in navigator)window.addEventListener('load',()=>navigator.serviceWorker.register('sw.js').catch(()=>{}));
</script>
